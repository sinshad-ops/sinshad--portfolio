   \"billing\": 0,\n          \"delivery\": 0,\n          \"general\": 3,\n          \"refund\": 0,\n          \"technical\": 2\n        },\n        \"refund\": {\n          \"account\": 0,\n          \"billing\": 1,\n          \"delivery\": 0,\n          \"general\": 0,\n          \"refund\": 3,\n          \"technical\": 1\n        },\n        \"technical\": {\n          \"account\": 0,\n          \"billing\": 0,\n          \"delivery\": 0,\n          \"general\": 0,\n          \"refund\": 0,\n          \"technical\": 5\n        }\n      },\n      \"macro_f1\": 0.7704008954008953,\n      \"n\": 30,\n      \"per_class\": {\n        \"account\": {\n          \"f1\": 0.7499999999999999,\n          \"precision\": 1.0,\n          \"recall\": 0.6,\n          \"support\": 5\n        },\n        \"billing\": {\n          \"f1\": 0.7692307692307693,\n          \"precision\": 0.625,\n          \"recall\": 1.0,\n          \"support\": 5\n        },\n        \"delivery\": {\n          \"f1\": 0.888888888888889,\n          \"precision\": 1.0,\n          \"recall\": 0.8,\n          \"support\": 5\n        },\n        \"general\": {\n          \"f1\": 0.7499999999999999,\n          \"precision\": 1.0,\n          \"recall\": 0.6,\n          \"support\": 5\n        },\n        \"refund\": {\n          \"f1\": 0.7499999999999999,\n          \"precision\": 1.0,\n          \"recall\": 0.6,\n          \"support\": 5\n        },\n        \"technical\": {\n          \"f1\": 0.7142857142857143,\n          \"precision\": 0.5555555555555556,\n          \"recall\": 1.0,\n          \"support\": 5\n        }\n      }\n    },\n    \"urgency\": {\n      \"accuracy\": 0.43333333333333335,\n      \"confusion\": {\n        \"high\": {\n          \"high\": 2,\n          \"low\": 4,\n          \"medium\": 0\n        },\n        \"low\": {\n          \"high\": 1,\n          \"low\": 5,\n          \"medium\": 0\n        },\n        \"medium\": {\n          \"high\": 3,\n          \"low\": 9,\n          \"medium\": 6\n        }\n      },\n      \"macro_f1\": 0.4166666666666667,\n      \"n\": 30,\n      \"per_class\": {\n        \"high\": {\n          \"f1\": 0.3333333333333333,\n          \"precision\": 0.3333333333333333,\n          \"recall\": 0.3333333333333333,\n          \"support\": 6\n        },\n        \"low\": {\n          \"f1\": 0.4166666666666667,\n          \"precision\": 0.2777777777777778,\n          \"recall\": 0.8333333333333334,\n          \"support\": 6\n        },\n        \"medium\": {\n          \"f1\": 0.5,\n          \"precision\": 1.0,\n          \"recall\": 0.3333333333333333,\n          \"support\": 18\n        }\n      }\n    }\n  },\n  \"project\": \"annotation\",\n  \"qc\": {\n    \"malformed_span_quarantine\": 2,\n    \"manual_queue\": 29\n  },\n  \"simulation_not_human\": {\n    \"agreement\": 0.87,\n    \"controlled_errors\": 13,\n    \"rate\": 0.13,\n    \"warning\": \"SIMULATION NOT HUMAN; not annotator agreement\"\n  },\n  \"split\": {\n    \"calibration\": 70,\n    \"holdout\": 30\n  }\n}\n```\n", "../02-AI-Data-Annotation/results/findings.md": "# Findings and decision implications\n\nOn the 30-record held-out partition, the frozen keyword baseline achieves topic accuracy 76.7%, sentiment accuracy 40.0%, and urgency accuracy 43.3%. This uneven performance shows why annotation requires meaning-level review rather than keyword matching.\n\nExact entity-span F1 is 0.000 on holdout. The extractor only recognizes limited order/date formats, not PRODUCT or ORG names; unsupported entity classes are not silently excluded from the denominator. The weak result is intentional evidence of baseline scope, not an annotation-quality claim.\n\n29 records enter the structural/ambiguity review queue, and 2 records have span warnings. The simulated second-label exercise injects 13 known topic corruptions; its agreement statistic is a simulation, not human inter-annotator agreement. Calibration/holdout is a fixed order split, not random population sampling; no dictionaries were tuned on held-out labels during this run.\n\n## Next validation step\nBlind human review of the source evidence, followed by adjudication and a new unseen benchmark.\n", "../02-AI-Data-Annotation/experiments/banking77/README.md": "# BANKING77 — real public-data intent classification & label QA\n\nA separate real-data experiment within Sinshad PS's AI-assisted evaluation portfolio. The existing six-label synthetic annotation benchmark is preserved separately, not replaced or relabeled.\n\n## Objective\nEvaluate a transparent intent-classification baseline against published labels, audit source integrity and split leakage, and produce a reviewable error queue. This demonstrates a data/evaluation pipeline; it does **not** claim that the portfolio owner collected the queries, annotated them, or achieved a personal annotator-quality score.\n\n## Verified source and license\n- Original repository: https://github.com/PolyAI-LDN/task-specific-datasets\n- Pinned revision: `57ec275d8078af65b7731c2a98be812d844a6d6b`\n- Dataset files: `banking_data/train.csv`, `banking_data/test.csv`, `banking_data/categories.json`.\n- The upstream README explicitly says its shared datasets are governed by the repository LICENSE, which is **Creative Commons Attribution 4.0 International**. This is not merely an assumption about a code license.\n- Hugging Face dataset card corroborates CC BY 4.0: https://huggingface.co/datasets/PolyAI/banking77\n- Full license: [`source/BANKING77_LICENSE.txt`](source/BANKING77_LICENSE.txt). License URL: https://creativecommons.org/licenses/by/4.0/\n- Source documentation is retained in [`source/UPSTREAM_README.md`](source/UPSTREAM_README.md).\n- Every source file is pinned by SHA-256 in [`source/source-manifest.json`](source/source-manifest.json).\n\n## Attribution and changes\n**BANKING77 by Iñigo Casanueva, Tadas Temcinas, Daniela Gerz, Matthew Henderson and Ivan Vulić / PolyAI.** Cite *Efficient Intent Detection with Dual Sentence Encoders*, Proceedings of the 2nd Workshop on NLP for ConvAI, ACL 2020: https://arxiv.org/abs/2003.04807\n\nOriginal queries and categories are not rewritten. Derived JSONL adds stable IDs, split and provenance fields. Feature extraction normalizes Unicode/case and produces word unigrams/bigrams. Results, predictions and review queues are newly generated. Source labels remain published annotations, not personally reannotated labels. No affiliation, endorsement or production-client relationship is implied. Upstream as-is warranty disclaimers remain applicable.\n\n## Dataset\n- 10,003 official training queries.\n- 3,080 official test queries.\n- 77 fine-grained English banking intents, retaining the original category spelling and capitalization.\n- No sentiment, Malayalam, entity-span or safety labels have been fabricated for this dataset.\n- `source_record_id` identifies a parsed CSV record, not an assumed physical line number.\n\n## Methodology\n1. Verify the five original files against pinned byte counts and hashes.\n2. Validate text/labels and official counts; reject invalid inputs rather than silently repairing them.\n3. Audit within-split duplicates, normalized train/test overlap and conflicting reference labels.\n4. Split official training into approximately 85% fit / 15% development data using deterministic per-class **normalized-text groups**. Identical normalized text stays on one side.\n5. Train word-unigram + word-bigram multinomial Naive Bayes with additive smoothing values `0.1`, `0.5`, `1.0`. Features and vocabulary come from fit only during selection. Keep negation and stop words.\n6. Select alpha by development macro-F1, then development accuracy, then smaller alpha. No test labels are used to choose parameters.\n7. Refit on all official training data, evaluate once on the official test set, and compare with a training-frequency majority classifier.\n8. Report accuracy, macro-F1, top-3 accuracy, all per-intent scores, a 77×77 confusion matrix and error examples.\n9. Report a secondary test score excluding exact normalized-text overlap with training; do not silently alter the official split.\n10. Queue published-label disagreements and confidence below a **predeclared 0.8 threshold**. Human review fields stay blank. Confidence is uncalibrated, so neither the threshold nor high-confidence predictions guarantee correctness.\n\n## Metric definitions\n- Accuracy = correct predictions / evaluated queries.\n- Per-intent precision = TP/(TP+FP); recall = TP/(TP+FN); F1 = harmonic mean.\n- Macro-F1 = unweighted mean of all 77 per-intent F1 scores; undefined class rates are zero.\n- Top-3 accuracy = fraction whose published intent appears in the three highest-scoring classes.\n- Naive Bayes log score = log class prior + sum(feature count × log smoothed feature probability). Softmax of log scores supplies an explicitly uncalibrated confidence.\n- Coverage = retained predictions / all test queries; retained accuracy is conditional on the threshold.\n\n## Reproduce\nFrom this experiment directory:\n\n```bash\npython ingest.py\npython run_experiment.py\npython -m unittest discover -s tests -v\n```\n\nRaw files are included under their attributed CC BY 4.0 license, so this runs offline. To retrieve missing original files from the pinned source:\n\n```bash\npython ingest.py --download\npython run_experiment.py --download\n```\n\nFrom portfolio root:\n\n```bash\npython 02-AI-Data-Annotation/experiments/banking77/run_experiment.py\npython -m unittest discover -s 02-AI-Data-Annotation/experiments/banking77/tests -v\n```\n\nThe classifier uses the Python standard library; plots use the portfolio's existing Pillow dependency. No paid API, pretrained model download or large ML dependency is required.\n\n## Actual results and artifacts\n- [Measured report](results/REPORT.md)\n- [Metrics](results/metrics.json) and [frozen configuration](results/config.json)\n- [Training-only alpha selection](results/validation-selection.json)\n- [Source QA](results/source-qa.json) and [label-conflict flags](results/label-conflicts.json)\n- [Official-test predictions](results/test_predictions.csv)\n- [Per-intent scores](results/per_intent.csv) and [confusion matrix](results/confusion_matrix.csv)\n- [Top confusions](results/top_confusions.csv), [review queue](results/review_queue.csv), [confidence/coverage sensitivity](results/confidence_coverage.csv)\n- [Executed notebook](notebooks/analysis.ipynb)\n- [Small attributed training sample](data/derived/training_sample_77.csv)\n\n![Computed benchmark chart](results/benchmark.png)\n\n## Limitations and future work\nThis is one established public English banking benchmark. It does not measure personal annotation accuracy, financial expertise, deployment safety, multilingual quality or production generalization. Published references can be ambiguous. The baseline is lexical; confidence is not calibrated. Human adjudication, new-domain evaluation and model improvements require separate experiments. Do not revise the model repeatedly against the same official test set and call it unseen validation.\n\n## Claim you may accurately use\n> My AI-assisted portfolio includes a reproducible BANKING77 experiment using the official public dataset, pinned source hashes, training-only parameter selection, classifier metrics and an unfilled error-adjudication queue. Original labels are credited to the dataset authors.\n", "../02-AI-Data-Annotation/experiments/banking77/results/QA_CASE_STUDY.md": "# Reference-labelled batch QA audit\n\nActual analysis of the BANKING77 official-test predictions. This is a portfolio simulation of a labelled audit workflow, not client work or a released production batch.\n\n| Query-length cohort | Queries | Accuracy | High-confidence errors |\n|---|---:|---:|---:|\n| 01_short_1_to_7_words | 929 | 82.45% | 89 |\n| 02_medium_8_to_15_words | 1745 | 86.65% | 161 |\n| 03_long_16_plus_words | 406 | 90.39% | 29 |\n\n## Operational interpretation\n- A schema pass is not a semantic quality pass. Published-label disagreement and confidence are distinct signals.\n- High-confidence errors occur; the Naive Bayes probability is not calibrated and must not be used as a quality guarantee.\n- Disagreement detection here requires published reference labels. For unseen production data, those labels may not exist; use independent sampled review rather than claiming this audit catches all errors.\n- Query length is a descriptive cohort, not a protected demographic attribute or proof of fairness.\n- The original 535-case queue is not adjudicated; no batch approval or personal review is claimed.\n\n## Proposed workflow (not represented as previously performed)\n1. Verify source hashes and label schema. Quarantine invalid rows instead of guessing labels.\n2. Preserve published references and raw text; log new model outputs separately.\n3. Route labelled disagreements and low-confidence cases to review. Check high-confidence predictions by random sampling as well.\n4. Record reviewer decision, evidence and reason; escalate ambiguous cases to a second reviewer.\n5. Rerun metrics after adjudication while preserving the original benchmark for comparison.\n6. Use a clearly recorded owner approval before any hypothetical batch release.\n", "../02-AI-Data-Annotation/experiments/banking77/results/REPORT.md": "# Actual BANKING77 results\n\nOfficial train/test: 10,003/3,080 queries; 77 published intents.\nTraining-only validation: 8,505 fit / 1,498 validation; alpha selected=0.1.\n\n| Model | Official-test accuracy | Macro-F1 |\n|---|---:|---:|\n| Majority (training frequency) | 1.30% | 0.0003 |\n| Word unigram+bigram multinomial NB | 85.88% | 0.8579 |\n\nCorrect top-1 predictions: 2645/3080. Top-3 accuracy: 95.16%.\n\n## Duplicate/leakage audit\n7 normalized texts occur in both official splits, affecting 7 test rows.\nSecondary test excluding train-overlapping texts: 3073 rows, accuracy 85.84%, macro-F1 0.8575. The official split remains intact.\nDuplicate extra rows: {'train': 4, 'test': 1}. Conflicting-label groups flagged: 0.\nNo labels or rows were silently corrected or removed. The fit/validation split groups equal normalized text to prevent within-training leakage.\n\n## Failure evidence\n435 prediction/reference disagreements; 535 cases require review because of disagreement or low uncalibrated confidence.\nWeakest intents by measured F1:\n- `contactless_not_working`: F1 0.545; support 40\n- `card_not_working`: F1 0.660; support 40\n- `top_up_failed`: F1 0.705; support 40\n- `declined_card_payment`: F1 0.737; support 40\n- `pending_transfer`: F1 0.743; support 40\n\nLargest measured confusion pairs:\n- `contactless_not_working` → `card_not_working`: 12 cases\n- `card_payment_not_recognised` → `direct_debit_payment_not_recognised`: 6 cases\n- `fiat_currency_support` → `exchange_via_app`: 6 cases\n- `pending_transfer` → `transfer_timing`: 6 cases\n- `failed_transfer` → `beneficiary_not_allowed`: 5 cases\n\nThe published label is a reference, not infallible gold. Incorrect predictions may reflect lexical overlap, subtle distinctions, out-of-vocabulary words or ambiguous labels. These are hypotheses for human review, not completed manual adjudications.\n\n## Limits\n- Single banking domain, English only; no evidence for Malayalam, sentiment, entity spans, safety or multilingual generalization.\n- Simple lexical classifier; no transformer or production-service evaluation.\n- The probabilities are uncalibrated. Coverage tables describe a sensitivity analysis, not guaranteed precision.\n- A reused public test set does not demonstrate novelty or deployment readiness.\n- Data collection and original annotation were done by the published dataset authors, not the portfolio owner.\n- This implementation/documentation was AI-assisted. No personal human annotation score is claimed.\n\n![Measured results](benchmark.png)\n\n## Worked disagreement examples (not manually adjudicated)\n\n### banking77:test:00000\n> How do I locate my card?\nPublished: `card_arrival`; predicted: `get_physical_card`.\nUncalibrated confidence: 0.999. Human rationale and corrected-label fields remain blank.\n\n### banking77:test:00005\n> When will I get my card?\nPublished: `card_arrival`; predicted: `card_delivery_estimate`.\nUncalibrated confidence: 0.915. Human rationale and corrected-label fields remain blank.\n\n### banking77:test:00011\n> How long does a card delivery take?\nPublished: `card_arrival`; predicted: `card_delivery_estimate`.\nUncalibrated confidence: 0.999. Human rationale and corrected-label fields remain blank.\n\n### banking77:test:00020\n> I did not get my card yet, is it lost?\nPublished: `card_arrival`; predicted: `getting_virtual_card`.\nUncalibrated confidence: 0.686. Human rationale and corrected-label fields remain blank.\n\n### banking77:test:00022\n> How long should my new card take to arrive?\nPublished: `card_arrival`; predicted: `card_delivery_estimate`.\nUncalibrated confidence: 0.726. Human rationale and corrected-label fields remain blank.\n", "../02-AI-Data-Annotation/experiments/banking77/results/VALIDATION.md": "# Banking77 release validation\n\n{\n  \"status\": \"PASS\",\n  \"banking77_tests\": 10,\n  \"preserved_suite_tests\": 11,\n  \"notebook_executed_and_output_verified\": true,\n  \"banking77_numeric_and_csv_byte_reproduction\": \"PASS\",\n  \"synthetic_source_data_files_byte_preserved\": 156,\n  \"all_six_synthetic_metric_values_preserved\": true,\n  \"personal_human_annotation_performed\": false,\n  \"run_date\": \"2026-10-09\"\n}\n\n## Test logs\n```text\n\n\n\ntest_annotation_labels_spans_and_counts (test_portfolio.PortfolioTests.test_annotation_labels_spans_and_counts) ... ok\ntest_deterministic_analysis (test_portfolio.PortfolioTests.test_deterministic_analysis) ... ok\ntest_image_pixels (test_portfolio.PortfolioTests.test_image_pixels) ... ok\ntest_judge_score_range (test_portfolio.PortfolioTests.test_judge_score_range) ... ok\ntest_manifest_hashes (test_portfolio.PortfolioTests.test_manifest_hashes) ... ok\ntest_output_consistency (test_portfolio.PortfolioTests.test_output_consistency) ... ok\ntest_schemas_ids_and_counts (test_portfolio.PortfolioTests.test_schemas_ids_and_counts) ... ok\ntest_all_notebooks_are_executed_outputs (test_regressions.RegressionTests.test_all_notebooks_are_executed_outputs) ... ok\ntest_baseline_does_not_depend_on_reference_labels (test_regressions.RegressionTests.test_baseline_does_not_depend_on_reference_labels) ... ok\ntest_metric_known_values (test_regressions.RegressionTests.test_metric_known_values) ... ok\ntest_multilingual_none_is_not_error (test_regressions.RegressionTests.test_multilingual_none_is_not_error) ... ok\n\n----------------------------------------------------------------------\nRan 11 tests in 3.131s\n\nOK\n\n\ntest_development_group_leakage (test_banking77.Banking77Tests.test_development_group_leakage) ... ok\ntest_features_keep_negation (test_banking77.Banking77Tests.test_features_keep_negation) ... ok\ntest_known_metric_values (test_banking77.Banking77Tests.test_known_metric_values) ... ok\ntest_metrics_recalculate (test_banking77.Banking77Tests.test_metrics_recalculate) ... ok\ntest_model_predictions_need_only_text (test_banking77.Banking77Tests.test_model_predictions_need_only_text) ... ok\ntest_official_counts_and_labels (test_banking77.Banking77Tests.test_official_counts_and_labels) ... ok\ntest_official_source_hashes (test_banking77.Banking77Tests.test_official_source_hashes) ... ok\ntest_official_test_matches_predictions (test_banking77.Banking77Tests.test_official_test_matches_predictions) ... ok\ntest_review_queue_has_no_invented_human_ratings (test_banking77.Banking77Tests.test_review_queue_has_no_invented_human_ratings) ... ok\ntest_validation_only_parameter_selection (test_banking77.Banking77Tests.test_validation_only_parameter_selection) ... ok\n\n----------------------------------------------------------------------\nRan 10 tests in 0.145s\n\nOK\n\n```\n\nOriginal metric JSON may be serialized with different line endings on different platforms; numerical values are unchanged. New Banking77 predictions/metrics were identical on repeated same-environment execution.\n", "../01-LLM-Evaluation/data/DATA_CARD.md": "# Data Card — LLM Pairwise Evaluation\n\n## Summary\n50 pairwise prompts and 100 candidate responses; full judge inputs and raw decisions retained.\n\n## Intended use\nLocal portfolio demonstration of reproducible evaluation, QA queues, metric computation, and evidence review. It is not production training data, employer work, or a validated benchmark.\n\n## Provenance\nThe supplied source arrays and generated artifacts are AI-assisted synthetic personal-project data authored for Sinshad PS. LLM, multilingual, safety, annotation, and search labels are provisional unless explicitly described as rendering-derived ground truth. No independent human validation has been completed.\n\n## Size\nPrimary case count reported by the pipeline: **50**.\n\n## Processing\nSource arrays are normalized into UTF-8 JSONL and CSV. Nested values in CSV are JSON-encoded. Source IDs are preserved. Deterministic build seed: `20261008`.\n\n## Risks and limitations\nSynthetic composition can make patterns easier than real operations. Reviewer demographics, adjudication, inter-annotator agreement, natural distribution shift, and external validity are absent. Sensitive production deployment requires qualified human review.\n\n## License\nCode: MIT. Synthetic data: CC BY 4.0; see repository `DATA_LICENSE.md`.\n", "../01-LLM-Evaluation/qa/worked-cases.md": "# Worked Cases — LLM Pairwise Evaluation\n\nThese cases use actual repository records. Decisions are provisional or geometry-derived as stated; they are not completed human reviews.\n\n## Case 1: `L1`\n**Input/evidence:** Calculate the total cost and state the calculation.\n\nSource context:\nA community center is buying notebooks for a workshop. There are 7 packs, and each pack contains 8 notebooks. Each notebook costs $3. The supplier applies no discount, tax, delivery fee, or other charge. The organizer asks for the total cost of all notebooks, not the number of notebooks. All quantities are whole numbers, and the stated unit price applies equally to every notebook.\n\n**Candidate/output:** A: The center will receive 56 notebooks because 7 packs × 8 notebooks equals 56. At $3 per notebook, the total is 56 × 3 = $168. Therefore, the total purchase cost is $168, excluding no additional charges because none are listed.\nB: The total is $21. This multiplies the 7 packs by the $3 price and treats each pack as one priced unit. The 8 notebooks per pack affects the quantity received, but it does not affect the stated total under the supplier’s pricing.\n\n**Rubric applied:** Pairwise accuracy, instruction following, helpfulness, clarity\n\n**QC:** Provisional=A; AI judge=A\n\n**Decision:** A\n\n**Explicit evidence/rationale:** Candidate A correctly calculates 7 × 8 = 56 notebooks and 56 × $3 = $168. Candidate B gives the wrong total by multiplying packs directly by the unit price.\n\n## Case 2: `L2`\n**Input/evidence:** Determine which proposed appointment complies with the scheduling constraints.\n\nSource context:\nA clinic schedules intake calls only on Tuesdays between 9:00 a.m. and 12:00 p.m. The call must last 30 minutes, and the patient cannot attend before 10:00 a.m. or after 11:00 a.m. A proposed appointment is Tuesday at 11:00 a.m. The clinic treats an appointment ending exactly at noon as within the allowed window. No other scheduling constraints are provided, and the question asks whether this particular proposal is acceptable.\n\n**Candidate/output:** A: The appointment is not acceptable because it starts at the latest time the patient can attend. The clinic should choose 10:30 a.m. instead so there is more flexibility before the noon cutoff.\nB: The appointment is acceptable. It starts at 11:00 a.m., which is not after the patient’s 11:00 a.m. limit, and a 30-minute call ends at 11:30 a.m., within the clinic’s Tuesday 9:00 a.m. to noon window.\n\n**Rubric applied:** Pairwise accuracy, instruction following, helpfulness, clarity\n\n**QC:** Provisional=B; AI judge=B\n\n**Decision:** B\n\n**Explicit evidence/rationale:** Candidate B correctly applies both the patient's attendance limits and the clinic's operating window. Candidate A incorrectly treats starting at 11:00 a.m. as impermissible.\n\n## Case 3: `L3`\n**Input/evidence:** Extract the product names that are marked as backordered.\n\nSource context:\nThe inventory note lists four products and statuses: Cedar mug — in stock; Harbor lamp — backordered; Linen throw — discontinued; Orchard tray — backordered. The note says that “backordered” means orders may be placed but shipment is delayed. Product names should be reproduced as written, without adding categories, quantities, or interpretations. The requested output is the names of all and only the products whose status exactly matches “backordered.”\n\n**Candidate/output:** A: The backordered products are Harbor lamp and Orchard tray. The Cedar mug is in stock, while the Linen throw is discontinued, so neither belongs in the requested list.\nB: The backordered products are Harbor lamp, Linen throw, and Orchard tray. The discontinued item is included because discontinued products are also unavailable for immediate shipment.\n\n**Rubric applied:** Pairwise accuracy, instruction following, helpfulness, clarity\n\n**QC:** Provisional=A; AI judge=A\n\n**Decision:** A\n\n**Explicit evidence/rationale:** Candidate A extracts exactly the two products marked backordered. Candidate B adds a product based on an unsupported interpretation rather than matching the exact status.\n", "../01-LLM-Evaluation/results/analysis.md": "# Results Analysis\n\n## Scope\nThese numbers are generated from the repository data by `analysis.py`; they are not manually entered.\n\n## Primary interpretation\nCompare the held-back provisional author preference with a separate AI scoring pass preference. Compute a three-class confusion matrix, agreement, category slices, score means, threshold sensitivity, and response-level pass rules.\n\n## Important boundary\nNeither the provisional author preference nor AI judge is human gold. Both calls use the Strawberry fast tier; underlying model identity/version and temperature were not supplied. Independence of model family is not established. Agreement is not model accuracy or human kappa.\n\n## Decision use\nMetrics identify patterns and prioritize review. They do not replace human adjudication, prove production readiness, or establish the author’s personal accuracy.\n\n## Machine-readable snapshot\n```json\n{\n  \"agreement_rate\": 0.9,\n  \"case_count\": 50,\n  \"confusion\": {\n    \"A\": {\n      \"A\": 22,\n      \"B\": 0,\n      \"tie\": 0\n    },\n    \"B\": {\n      \"A\": 0,\n      \"B\": 23,\n      \"tie\": 0\n    },\n    \"tie\": {\n      \"A\": 4,\n      \"B\": 1,\n      \"tie\": 0\n    }\n  },\n  \"disagreements\": 5,\n  \"mean_scores\": {\n    \"accuracy\": 3.13,\n    \"clarity\": 4.5,\n    \"helpfulness\": 3.13,\n    \"instruction_following\": 3.44\n  },\n  \"pass_rate\": 0.5,\n  \"pass_rule\": \"weighted>=4 and accuracy>=4 and instruction_following>=4\",\n  \"per_category\": {\n    \"arithmetic\": {\n      \"agreement\": 0.8,\n      \"n\": 5\n    },\n    \"coding\": {\n      \"agreement\": 0.8,\n      \"n\": 5\n    },\n    \"customer_support\": {\n      \"agreement\": 1.0,\n      \"n\": 7\n    },\n    \"extraction\": {\n      \"agreement\": 0.8333333333333334,\n      \"n\": 6\n    },\n    \"information_retrieval\": {\n      \"agreement\": 1.0,\n      \"n\": 2\n    },\n    \"instruction_following\": {\n      \"agreement\": 0.8333333333333334,\n      \"n\": 6\n    },\n    \"inventory\": {\n      \"agreement\": 1.0,\n      \"n\": 1\n    },\n    \"reasoning\": {\n      \"agreement\": 1.0,\n      \"n\": 6\n    },\n    \"scheduling\": {\n      \"agreement\": 1.0,\n      \"n\": 1\n    },\n    \"summarization\": {\n      \"agreement\": 0.75,\n      \"n\": 4\n    },\n    \"travel_policy\": {\n      \"agreement\": 1.0,\n      \"n\": 2\n    },\n    \"uncertainty\": {\n      \"agreement\": 1.0,\n      \"n\": 5\n    }\n  },\n  \"project\": \"llm\",\n  \"provenance\": {\n    \"author_reference\": \"Strawberry fast model, family/version unspecified\",\n    \"human_gold\": false,\n    \"separate_scoring_pass\": \"Strawberry fast model, family/version unspecified\",\n    \"timestamp\": \"2026-10-08\"\n  },\n  \"response_count\": 100,\n  \"threshold_sensitivity\": {\n    \"3.5\": 0.5,\n    \"4.0\": 0.5,\n    \"4.5\": 0.5\n  },\n  \"ties\": {\n    \"judge\": 0,\n    \"provisional\": 5\n  },\n  \"weighted_formula\": \"0.4*accuracy + 0.3*instruction_following + 0.2*helpfulness + 0.1*clarity\"\n}\n```\n", "../01-LLM-Evaluation/results/findings.md": "# Findings and decision implications\n\nThe separate AI scoring pass agrees with provisional author preferences on 45/50 pairs (90.0%). There are 5 disagreements, all retained in the review queue. The author and scorer use the same Strawberry tier; their underlying model identities are unavailable. This is not independent-human agreement.\n\nThe provisional references contain 5 ties; the scorer contains 0 ties. Inspect ties before interpreting aggregate agreement: a forced preference can hide equally useful alternatives. Pass rate across 100 synthetic candidate responses is 50.0% under the documented weighted rubric. It describes this constructed response set, not a real model or the candidate's personal accuracy.\n\n## Next validation step\nBlind human review of the source evidence, followed by adjudication and a new unseen benchmark.\n", "../01-LLM-Evaluation/experiments/hh-preference/README.md": "# HH-RLHF public preference study\n\nA real public-data addition to the LLM evaluation project. It compares simple answer-length proxies with **original published human preferences**—not personally annotated labels or newly generated model responses.\n\n## Source and attribution\nAnthropic, *Training a Helpful and Harmless Assistant with Reinforcement Learning from Human Feedback* (2022): https://arxiv.org/abs/2204.05862\n\nOfficial repository: https://github.com/anthropics/hh-rlhf\nDataset card: https://huggingface.co/datasets/Anthropic/hh-rlhf\nPinned revision: `c72f5cee8eb7b4d2ea5617657f4430d5e333af07`.\nInput: `helpful-base/test.jsonl.gz`, SHA-256 `8be3fc1a13b27901631696f2be6f184c799f1baeaf145f53ac5db24960adc37b`.\n\nThe repository and dataset card specify MIT licensing. Original copyright/permission notice is retained in [`source/UPSTREAM_LICENSE.txt`](source/UPSTREAM_LICENSE.txt); preserve it when redistributing the derived sample. Original README and warnings are retained. No Anthropic affiliation or endorsement is implied. The source warns of potentially offensive material and is intended for preference/research analysis, not supervised fine-tuning of dialogue agents.\n\n## What is actually included\n- 200 paired examples / 400 original candidate answers.\n- Original context and published chosen/rejected preference, converted to alternating A/B display order.\n- Source revision and original JSONL line ID on every row.\n- Input hashes and a hash of the immutable derived sample.\n- Actual baseline metrics, topic breakdown, tie/coverage accounting, chart, failure queue and blank human-review forms.\n- Executable ingestion/reanalysis and tests.\n\n## Selection and changes\nThe official helpful-base test contains 2,354 records. Predeclared lexical/topic/context/size rules retained 304 eligible records; deterministic SHA ordering selects 200. The sample emphasizes computing, science and everyday practical tasks. Broad risky-content and email-word filters reduce exposure, but **are not human safety certification**. Selection rules and excluded counts are reported, not hidden. Display order changes; original answers and source preferences are not rewritten. This is a curated sample, not a representative evaluation of the full dataset.\n\n## Actual finding\nThe longer-answer proxy agrees with the published preference on **117/195 non-tied pairs (60%)**, with five ties and 97.5% coverage. Over all 200 pairs, counting ties as no agreement, agreement is **58.5%**. A deterministic coin baseline is **50.5%**. This illustrates why surface-level proxies cannot replace a quality rubric; it is not an impressive model score or personal evaluation accuracy.\n\n## Reproduce\n```bash\npython run_experiment.py\npython -m unittest discover -s tests -v\n```\nThe hash-verified selected sample is bundled, so reanalysis works offline. To independently reconstruct the sample from original source:\n```bash\npython run_experiment.py --download\n```\nOriginal compressed content goes into `data/cache/` and is excluded from the public package. No model API is required; charting uses Pillow already listed in root requirements.\n\n## Reviewer workflow\nUse the existing project rubric to assess accuracy, relevance, completeness and instruction following. Use the shared conversation context; source preference may depend on considerations beyond factual correctness. Record a reason when disagreeing with a preference. `results/human_review_forms.csv` is blank by design, and no completed personal review is claimed. Published human preference is subjective and is not factual-correctness gold.\n\n## Evidence\n- [Actual report](results/REPORT.md)\n- [Metric values and topic counts](results/metrics.json)\n- [Proxy failure queue](results/length_proxy_failure_queue.csv)\n- [Review forms](results/human_review_forms.csv)\n- [Source metadata](source/source-manifest.json)\n- [Sample hash/selection ledger](source/sample-manifest.json)\n\n![Computed proxy benchmark](results/benchmark.png)\n\n## Limitations\nOne curated subset from an older public dataset, not a current production evaluation. No newly generated model comparison, personally written annotations, model safety certification, or employment evidence. Topic imbalance and lexical filtering introduce sampling bias. The findings concern preference-proxy limitations only. Implementation and documentation are AI-assisted.\n", "../01-LLM-Evaluation/experiments/hh-preference/results/REPORT.md": "# Public preference benchmark — actual results\n\n200 pairs / 400 responses selected from 2354 original test records; 304 passed the predeclared lexical/topic rules.\n\n| Baseline | Covered pairs | Agreement on covered | Ties |\n|---|---:|---:|---:|\n| seeded_coin | 200 | 50.50% | 0 |\n| longer_response | 195 | 60.00% | 5 |\n| shorter_response | 195 | 40.00% | 5 |\n\n## Conclusions and boundaries\n- Longer is not necessarily more helpful. A response-length proxy ignores accuracy, instruction following, tone, omissions and context.\n- Preferences were supplied by the original dataset, not personally labeled by Sinshad PS.\n- The educational-topic and risk-word filters intentionally bias this sample. Do not generalize these rates to the full dataset.\n- This benchmark does not produce new model outputs or validate a production LLM. It is a preference-analysis and evaluator-workflow demonstration.\n- Equal-length ties are abstentions; covered and all-pair rates are both reported.\n- Lexical filtering is not human safety certification. The full source can contain offensive material; it is not bundled.\n- Review forms remain blank. Published preferences are subjective and are not factual-correctness gold.\n\n## Reproduction\n`python run_experiment.py` reanalyzes the hash-verified bundled sample offline. `python run_experiment.py --download` reconstructs it from the pinned official gzip source.\n\n## Source\nAnthropic HH-RLHF, MIT license. Original source and terms are retained under `source/`. See experiment README for attribution.\n", "../06-Search-Relevance/results/metrics.json": "{\n  \"failure_queue\": 1,\n  \"mrr_relevance_gte_2\": 0.983333333333333
