<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio evidence — Sinshad PS</title><style>*{box-sizing:border-box}body{margin:0;background:#071827;color:#edf5f7;font:16px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:35px 25px}a{color:#21c9b4}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:25px}.badge{color:#f4b844;font-size:12px;letter-spacing:.08em;text-transform:uppercase}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#102b3c;border:1px solid #294658;border-radius:14px;padding:25px;font:15px/1.7 ui-monospace,Consolas,monospace}select{max-width:100%;background:#102b3c;color:#fff;padding:12px;border:1px solid #23c7b5;border-radius:7px}h1{font-size:30px;overflow-wrap:anywhere}@media(max-width:600px){main{padding:20px 14px}pre{font-size:13px;padding:15px}h1{font-size:24px}}</style></head><body><main><nav><a href="index.html">Back to portfolio</a><a id="original">Open original evidence file</a></nav><div class="badge">Traceable portfolio evidence · no live service required</div><h1 id="title">Evidence reader</h1><label for="doc">Choose an evidence document</label><br><select id="doc"></select><pre id="content"></pre></main><script>const DOCS={"../CHANGELOG.md": "# Changelog\n\n## 2026-10-09\n- Built six reproducible AI evaluation projects.\n- Added normalized datasets, metrics, charts, notebooks, QA queues, and worked cases.\n- Added offline portfolio website, career materials, tests, provenance, licenses, and SHA-256 data manifest.\n- Documented pending human review and external-validity limits.\n\n<!-- BANKING77:START -->\n## 2026-10-09 — Banking77 real-data release\n\nAdded official-source hash-verified ingestion; 77-intent NB experiment; group-aware training validation; majority baseline; official and train-text-disjoint test scores; source QA; confusion matrix; 535-case unadjudicated review queue; chart; notebook; 10 unit tests; source license and attribution. Kept original synthetic datasets and numerical results unchanged. No external publication.\n\n<!-- BANKING77:END -->\n", "../DATA_LICENSE.md": "# Synthetic Data License\n\nUnless a source extract states otherwise, the synthetic datasets generated for this portfolio are licensed under the [Creative Commons Attribution 4.0 International License](https://creativecommons.org/licenses/by/4.0/).\n\nAttribution: **AI Generalist Evaluation Portfolio, Sinshad PS, 2026**.\n\nThe data is AI-assisted and synthetic. The license does not represent that provisional labels are human validated, factually complete, safe for production, or free from bias. Third-party research extracts remain under their original publishers’ terms and are not relicensed here.\n\n\n\n\n\n<!-- BANKING77:START -->\n## Third-party BANKING77 data\n\n`02-AI-Data-Annotation/experiments/banking77/data/raw/` and data-derived text/reference annotations are BANKING77 by Casanueva et al. / PolyAI, licensed CC BY 4.0, not original data created by Sinshad PS. Attribution, source, license and modifications are documented in the experiment README. Preserve these notices and upstream disclaimer when redistributing; no endorsement is implied. Newly written pipeline code is covered by the portfolio code license.\n\n<!-- BANKING77:END -->\n\n<!-- HH_LICENSE:START -->\nThird-party HH-RLHF-derived sample text/preferences are by Anthropic under the original MIT notice in `01-LLM-Evaluation/experiments/hh-preference/source/UPSTREAM_LICENSE.txt`. Keep copyright and permission notices with redistribution. Original banking data remain CC BY 4.0. Neither dataset is original data collected or annotated by Sinshad PS.\n<!-- HH_LICENSE:END -->\n", "../EVIDENCE_BRIEF.md": "# Recruiter evidence brief\n\nSix AI-assisted personal projects. No employment, certification, client or independently verified human performance is implied.\n\n## 01-LLM-Evaluation\n\nThe separate AI scoring pass agrees with provisional author preferences on 45/50 pairs (90.0%). There are 5 disagreements, all retained in the review queue. The author and scorer use the same Strawberry tier; their underlying model identities are unavailable. This is not independent-human agreement.\n\nThe provisional references contain 5 ties; the scorer contains 0 ties. Inspect ties before interpreting aggregate agreement: a forced preference can hide equally useful alternatives. Pass rate across 100 synthetic candidate responses is 50.0% under the documented weighted rubric. It describes this constructed response set, not a real model or the candidate's personal accuracy.\n\n[Source data and reproduction](01-LLM-Evaluation/README.md)\n\n## 02-AI-Data-Annotation\n\nOn the 30-record held-out partition, the frozen keyword baseline achieves topic accuracy 76.7%, sentiment accuracy 40.0%, and urgency accuracy 43.3%. This uneven performance shows why annotation requires meaning-level review rather than keyword matching.\n\nExact entity-span F1 is 0.000 on holdout. The extractor only recognizes limited order/date formats, not PRODUCT or ORG names; unsupported entity classes are not silently excluded from the denominator. The weak result is intentional evidence of baseline scope, not an annotation-quality claim.\n\n29 records enter the structural/ambiguity review queue, and 2 records have span warnings. The simulated second-label exercise injects 13 known topic corruptions; its agreement statistic is a simulation, not human inter-annotator agreement. Calibration/holdout is a fixed order split, not random population sampling; no dictionaries were tuned on held-out labels during this run.\n\n[Source data and reproduction](02-AI-Data-Annotation/README.md)\n\n## 03-Multilingual-AI-Evaluation\n\nThe benchmark contains 50 English prompts and 100 Malayalam candidate translations. Automatic integrity checks flag 5 candidates. Passing these checks cannot establish semantic fidelity, grammatical correctness or cultural appropriateness.\n\nError categories describe synthetic benchmark construction. The category 'none' is retained in the composition table but is excluded from per-domain error-rate numerators. Digit mismatches are review flags because Malayalam may express a number in words. Native-speaker judgments, rationale edits and adjudication remain pending; blank reviewer forms are supplied rather than fabricated ratings.\n\n[Source data and reproduction](03-Multilingual-AI-Evaluation/README.md)\n\n## 04-Multimodal-AI-Evaluation\n\nThe visual dataset contains 120 unique rendered PNGs and 240 synthetic answer records. The actual RGB-pixel baseline correctly answers 54/60 eligible questions (90.0%), with 50.0% coverage and 60 abstentions.\n\nThe baseline reads image pixels for counts, color frequency and bar height. Ground truth is generated from rendering geometry; scene metadata is not used to predict answers. Abstentions cover spatial/absence/UI tasks unsupported by this baseline. Performance on simple colored components says nothing about photographs, real charts, OCR or a vision-language model. Six color-order failures in the eligible subset expose limitations of the leftmost tie heuristic on multi-row layouts.\n\n[Source data and reproduction](04-Multimodal-AI-Evaluation/README.md)\n\n## 05-AI-Quality-Evaluation\n\nThe lexical triage baseline achieves 42.0% agreement and macro-F1 0.250 against provisional project-owned safety decisions. There are 15 missed escalations and 0 unnecessary escalations.\n\nRisk words in a prompt do not establish that a response is unsafe: refusals, education and benign requests require contextual judgment. Conversely, a harmful implication can avoid trigger words. The score is not a safety certification. Missed escalations get review priority; over-refusal and reviewer cost must also be tracked. A revised classifier needs a fresh held-out set, not tuning on all 100 cases.\n\n[Source data and reproduction](05-AI-Quality-Evaluation/README.md)\n\n## 06-Search-Relevance\n\nAcross 30 fictional query sets (120 judged results), lexical ranking achieves NDCG@4 0.962 and MRR 0.983. The review queue contains 1 cases below NDCG 0.8.\n\nThese scores are likely optimistic because the synthetic snippets often repeat query terms and each query has only four candidate results. They are not search-engine performance. Evaluate synonym-heavy queries, ambiguous intent, misleading keyword overlap, locale mismatch and stale-but-on-topic results on a new collection before making stronger claims. Intended local coverage must be checked from the actual intent counts, not assumed from the generation brief.\n\n[Source data and reproduction](06-Search-Relevance/README.md)\n\n\n\n\n\n<!-- BANKING77:START -->\n## Completed real-data experiment: BANKING77\n\nThe six original projects remain **synthetic baselines**. An additional real public-data experiment now evaluates a classifier on **10,003 official training queries / 3,080 test queries / 77 intents**. Original annotations are attributed to Casanueva et al. / PolyAI under CC BY 4.0; no personal annotation claim is made.\n\n| Official test result | Value |\n|---|---:|\n| Multinomial Naive Bayes accuracy | 85.88% (2645/3080) |\n| Macro-F1 (77 intents) | 0.8579 |\n| Top-3 accuracy | 95.16% |\n| Majority baseline accuracy | 1.30% |\n| Accuracy after excluding 7 train-overlap test queries | 85.84% |\n| Pending automated review queue | 535 cases |\n\nAlpha=0.1 was selected using training-derived validation, not the test set. These are measured **classifier results against published labels**, not the portfolio owner's personal accuracy. All human-review fields remain blank.\n\n- [Experiment and reproduction](02-AI-Data-Annotation/experiments/banking77/README.md)\n- [Actual results, limitations and examples](02-AI-Data-Annotation/experiments/banking77/results/REPORT.md)\n- [Source hashes and license](02-AI-Data-Annotation/experiments/banking77/source/source-manifest.json)\n- [10 experiment tests](02-AI-Data-Annotation/experiments/banking77/tests/test_banking77.py)\n\n```bash\npython 02-AI-Data-Annotation/experiments/banking77/run_experiment.py\npython -m unittest discover -s 02-AI-Data-Annotation/experiments/banking77/tests -v\n```\n\n<!-- BANKING77:END -->\n\n<!-- HH_STUDY:START -->\n## Second completed public-data study: human preference analysis\n\n**200 HH-RLHF pairs / 400 original candidate responses**, with source-published human preferences, a pinned official revision, MIT notice and documented sampling rules. A longer-response proxy agrees on **117/195 non-tied pairs (60%)**, with five ties. The deterministic coin baseline is **50.5%**. This shows the limits of superficial ranking proxies—not personal evaluator accuracy or production-model quality.\n\n- [Source, methodology and reproduction](01-LLM-Evaluation/experiments/hh-preference/README.md)\n- [Actual results and bias limits](01-LLM-Evaluation/experiments/hh-preference/results/REPORT.md)\n- [Operational BANKING77 audit](02-AI-Data-Annotation/experiments/banking77/results/QA_CASE_STUDY.md)\n- [Practical review playbook](QUALITY_REVIEW_PLAYBOOK.md)\n\nThe portfolio contains **two real public-data studies plus six synthetic baseline demonstrations**. The original authors supplied public labels; personal review fields remain blank.\n\n<!-- HH_STUDY:END -->\n", "../FINAL_REVIEW.md": "# Release review\n\nThis package is complete as an AI-assisted synthetic portfolio starter release. It is not a completed independent human evaluation study.\n\n- Six projects contain actual data, code, measured results, charts, rubrics, methodology, worked examples and notebooks.\n- Candidate-output pairs are synthetic examples, not outputs captured from named production models.\n- Reference and scorer labels are distinct AI calls, not independent human annotators.\n- Visual ground truth is constructed from rendering geometry. Only the pixel baseline is an actual image-input evaluation.\n- Score limitations and baseline failures remain visible.\n- Malayalam reference text and judgments require native review.\n- Reviewer forms are blank. No personal quality score has been fabricated.\n- Existing employment dates are unverified and omitted from this resume.\n- No repository was uploaded, no website was published, and no LinkedIn entry was submitted.\n\nBefore presenting this as your personal competence, reproduce the analysis, review at least 10 cases per project, complete a blinded review batch, and be able to explain one error and one formula from each project. Record your real contributions in HUMAN_REVIEW.md. AI assistance should remain disclosed.\n\n## BANKING77 automated release checks\n\nCompleted real-data pipeline, 21 tests, executed notebook, identical rerun results, source attribution/license, synthetic preservation, and updated one-page PDF verified. Human adjudication remains pending and is not claimed. See RELEASE_NOTES.md.\n\n## Final complete edition\nTwo source-pinned public-data studies, six preserved synthetic baselines, QA cohort audit, role map and offline evidence reader included. 28 tests pass locally. Website JavaScript syntax and static local links are checked; new reader interactions have not been browser-retested. Human review and employment are not claimed. See FINAL_VALIDATION.json and START_HERE.md.\n", "../HUMAN_REVIEW.md": "# Human Review Plan\n\n## Current status\nAs of 2026-10-09, qualified independent human review remains pending.\n\n## Launch checklist\n- [ ] Assign reviewers and record role-relevant qualifications.\n- [ ] Blind reviewers to provisional labels where practical.\n- [ ] Complete Malayalam native review fields; do not copy AI scores.\n- [ ] Review annotation holdout without editing frozen dictionaries.\n- [ ] Adjudicate LLM author/judge disagreements.\n- [ ] Inspect safety escalation false negatives before false positives.\n- [ ] Review search failures with locale/domain context.\n- [ ] Sample image geometry and pixel baseline failures.\n- [ ] Record review date, reviewer ID, evidence, confidence, and rationale.\n- [ ] Resolve disagreements through a named adjudicator.\n- [ ] Re-run analysis and tests after accepted corrections.\n- [ ] Update provenance and release notes without retroactively hiding failures.\n\n## Unresolved at build date\nReviewer identities, qualification criteria, adjudication outcomes, Malayalam language scores, external benchmark validity, employer-policy mapping, and production launch approval are unresolved.\n", "../INTERVIEW_PREP.md": "# Interview prep: explain the work honestly\n\nUse this as a practice sheet, not as a script to memorise. The best answer is one you can support by opening the files and walking through an example.\n\n## A clear 20-second introduction\n\n“I’m a CSE student graduating in 2027, interested in remote AI evaluation, annotation and content-quality work. I’ve built a portfolio to practise rubrics, data checks, error analysis and review queues. Some projects use synthetic examples; two use public datasets with their original labels. I used AI tools during development, and I’m working through the cases so I can explain the choices and limitations myself.”\n\n## Questions you should be able to answer before an interview\n\n- Why did you choose this project, and what question were you trying to answer?\n- Which files contain the input data, the method, the results and the failures?\n- What does the main metric mean? What does it not mean?\n- Where did the labels come from? Which are synthetic and which are public?\n- Show one mistake or limitation and explain how you noticed it.\n- What did you personally inspect or change? Be specific; do not guess a number.\n- What would require a human reviewer or a Malayalam native speaker?\n- What parts were AI-assisted, and which decisions can you explain and defend?\n\n## Before you say you reviewed a project\n\nOpen at least ten records, including a few failures. Write down one correct result, one questionable result and one limitation in `PERSONAL-WORKBOOK.md`. Run the relevant script and tests. Only describe those steps as completed after you have done them.\n", "../PERSONAL-WORKBOOK.md": "# Personal review workbook — complete this yourself before publishing\n\nThis file is a working checklist, not a claim that the reviews have already happened. Add notes only after you have inspected the examples and run the code yourself. Keep the synthetic-data and AI-assistance disclosure in the public README.\n\n## A repeatable review session\n\n1. Run the project's analysis command from the repository root.\n2. Open at least 10 examples, including several failures or review-queue entries.\n3. Write down what the current label/rule says and what you think after inspecting the evidence.\n4. If you disagree, record why. Do not overwrite the original reference silently.\n5. If you change code or labels, rerun the analysis and tests and describe what changed.\n6. Practise explaining one metric and one failure without reading the README.\n\n## Record your actual work\n\nCopy this section once per project after you have completed a review. Leave it blank until then.\n\n### Project: [name]\n- Date reviewed:\n- Number of cases I personally inspected:\n- One example I agreed with and why:\n- One example I disagreed with and why:\n- Error or limitation I discovered:\n- Change I made (file and reason), if any:\n- Test/analysis command rerun:\n- What I can now explain confidently:\n- What still needs an expert or native-speaker review:\n\n## Project-specific review checklist\n\n- [ ] **LLM pairwise:** inspect a tie, a disagreement, and a high-scoring response. Explain the rubric weights and why agreement is not accuracy.\n- [ ] **Annotation:** inspect one topic error, one sentiment error, one urgency error, and one entity-span failure. Explain the fixed holdout split.\n- [ ] **Malayalam:** ask a qualified native speaker to review examples if available. Do not treat Unicode checks as translation-quality judgments.\n- [ ] **Visual:** inspect the PNG and corresponding question/answer. Explain what the pixel baseline supports and why it abstains on other tasks.\n- [ ] **Safety triage:** inspect missed escalations and benign examples containing risk words. Explain false negatives and false positives.\n- [ ] **Search relevance:** calculate one query's ranking by hand and inspect a misleading keyword-overlap case.\n\n## Before adding this to a CV or LinkedIn\n\n- [ ] I have run the project locally and can show it working.\n- [ ] I can explain the important functions in the code I claim to understand.\n- [ ] I can explain what each reported metric measures and what it does not measure.\n- [ ] I have not described synthetic data as client or production data.\n- [ ] I have not claimed human validation unless it actually happened and is documented.\n- [ ] My public description reflects my real contribution and retains the AI-assistance disclosure.\n", "../project-defensibility-guide.md": "# Project Defensibility Guide\n\n## Core formulas\n- Classification accuracy: correct predictions divided by total predictions.\n- Per-class F1: harmonic mean of precision and recall; macro-F1 averages class F1 equally.\n- Entity exact match: predicted and reference start, end, and label must all match.\n- LLM weighted score: 0.4 accuracy + 0.3 instruction following + 0.2 helpfulness + 0.1 clarity.\n- NDCG@4: DCG with gain `2^relevance−1` and `log2(rank+1)` discount, divided by ideal DCG.\n- MRR: reciprocal rank of the first result with relevance at least 2.\n- Pixel baseline coverage: eligible predictions divided by all visual questions.\n\n## Defensible statements\nSay “the pipeline measured X against provisional project references,” not “I achieved X% human accuracy.” Say “rendering-derived ground truth” only for visual geometry. Describe corruption labels as a controlled simulation, never human agreement.\n\n## Known failures\nKeyword rules miss paraphrases. Regex entities have narrow recall. Unicode checks cannot judge translation meaning. RGB components can merge or count UI pixels. Lexical safety rules over-trigger and miss context. Search overlap misses semantic intent.\n\n## Replication\nRun root analysis, inspect metrics and queues, execute tests, then compare data-file hashes with `DATA_MANIFEST.json`. Review code before trusting any metric.\n\n## Honest ownership discussion\nThe repository is AI-assisted. A defensible interview explanation identifies which artifacts were generated, which computations can be explained and rerun, which labels remain provisional, and what the author still needs to learn.\n", "../PROVENANCE.md": "# Provenance\n\n- Author attribution: Sinshad PS.\n- Build date: 2026-10-09.\n- Deterministic seed: 20261008.\n- Portfolio artifacts are AI-assisted synthetic personal projects, not employment deliverables.\n- The author has not represented these artifacts as independently personally reviewed.\n- LLM author references and judge outputs are known only as Strawberry fast model, same family unspecified. No model/version or temperature was supplied or invented.\n- Annotation, Malayalam, safety, and search references are provisional synthetic labels.\n- Multimodal gold values are constructed from deterministic rendering geometry.\n- No independent human gold, human kappa, qualification promise, job promise, or production certification is claimed.\n\n\n\n\n\n<!-- BANKING77:START -->\n## BANKING77 exception to the synthetic-data scope\n\nThe additional BANKING77 experiment uses original public English banking queries and published annotations. Data creators: Iñigo Casanueva, Tadas Temcinas, Daniela Gerz, Matthew Henderson and Ivan Vulić / PolyAI, 2020. Official revision `57ec275d8078af65b7731c2a98be812d844a6d6b`; license CC BY 4.0. Source files, hashes, original README, full license and transformation details are retained in the experiment. Derived IDs and classifier outputs are new; source text and categories are unchanged. No personal human annotation or endorsement is claimed. The rest of the original benchmark suite remains synthetic.\n\n<!-- BANKING77:END -->\n\n<!-- HH_ORIGIN:START -->\nHH-RLHF helpful-base test data are by Anthropic (2022), under the retained MIT license. This addition reorders original published chosen/rejected preferences into A/B pairs; original response text is not rewritten. Source hashes, line IDs and sample-selection exclusions are recorded. No personal human annotation, employment or Anthropic endorsement is claimed. The full source cache is not publicly bundled.\n<!-- HH_ORIGIN:END -->\n", "../QUALITY_REVIEW_PLAYBOOK.md": "# Practical quality-review playbook\n\nThis is a proposed/simulated workflow backed by reproducible public-data analyses. It is not a claim of employment or client delivery.\n\n## Daily workflow\nSource/version check → schema check → read prompt/context → evaluate output against rubric → label or rank → explain evidence → queue ambiguity → independent sampling → adjudicate → report limitations → owner approval.\n\n## Issue taxonomy\n- **Critical:** potential privacy/safety issue or source/identity mismatch. Quarantine and escalate; do not invent a replacement.\n- **Major:** wrong intent, unsupported factual assertion, missing required content, meaning-changing translation or visual mismatch.\n- **Minor:** readability, formatting or style problem that does not change the core meaning.\n- **Ambiguous:** evidence or rubric cannot resolve the choice. Record uncertainty rather than force a confident label.\n\nThese are suggested review definitions, not an employer's policy. Company instructions always determine the real task's rules.\n\n## Evidence rules\nReference-label disagreement is not automatically a bad reference label. Human preference is not factual-correctness gold. Unicode validation is not translation quality. Confidence is not accuracy. A procedural image benchmark is not natural-image model performance. A synthetic corruption test is not inter-annotator agreement.\n\n## Audit packet included\n- BANKING77 source hashes, official split, 77-label schema, model/reference predictions, confusion matrix and per-intent scores.\n- Query-length cohort audit and high-confidence-error counts in the BANKING77 QA case study.\n- 535 pending BANKING77 review cases and 200 HH-RLHF review forms.\n- HH-RLHF selected human-preference pairs with IDs and original-source attribution; length-proxy failure cases.\n- Original synthetic worked cases covering Malayalam, images, safety and search intent.\n\n## Personal reviewer practice — not completed by AI on your behalf\nFor each case record: source ID, rubric dimension, your decision, supporting evidence, confidence/uncertainty, escalation reason and date. Keep original labels intact. Only mark a review completed after actually doing it. Never claim clients, paid contracts, calibration sessions or production approvals that did not occur.\n", "../README.md": "# AI Evaluation & Data Quality Portfolio — Sinshad PS\n\n<!-- REAL_EVIDENCE:START -->\n## Second completed public-data study: human preference analysis\n\n**200 HH-RLHF pairs / 400 original candidate responses**, with source-published human preferences, a pinned official revision, MIT notice and documented sampling rules. A longer-response proxy agrees on **117/195 non-tied pairs (60%)**, with five ties. The deterministic coin baseline is **50.5%**. This shows the limits of superficial ranking proxies—not personal evaluator accuracy or production-model quality.\n\n- [Source, methodology and reproduction](01-LLM-Evaluation/experiments/hh-preference/README.md)\n- [Actual results and bias limits](01-LLM-Evaluation/experiments/hh-preference/results/REPORT.md)\n- [Operational BANKING77 audit](02-AI-Data-Annotation/experiments/banking77/results/QA_CASE_STUDY.md)\n- [Practical review playbook](QUALITY_REVIEW_PLAYBOOK.md)\n\nThe portfolio contains **two real public-data studies plus six synthetic baseline demonstrations**. The original authors supplied public labels; personal review fields remain blank.\n\n<!-- REAL_EVIDENCE:END -->\n\n\n\n\n\nI am a Computer Science Engineering student (expected graduation: 2027) exploring practical work in AI response evaluation, data annotation, multilingual QA, multimodal checks, content quality, and search relevance.\n\nThis repository is my **learning portfolio**. The six original baseline datasets and reference labels are synthetic. The added BANKING77 experiment uses public data and its original published annotations. The portfolio was developed with AI assistance. I have not presented it as client work or a production evaluation study. I am using it to practise building reproducible workflows, inspecting errors, and understanding where automated checks are not enough.\n\n\n\n<!-- BANKING77:START -->\n## Completed real-data experiment: BANKING77\n\nThe six original projects remain **synthetic baselines**. An additional real public-data experiment now evaluates a classifier on **10,003 official training queries / 3,080 test queries / 77 intents**. Original annotations are attributed to Casanueva et al. / PolyAI under CC BY 4.0; no personal annotation claim is made.\n\n| Official test result | Value |\n|---|---:|\n| Multinomial Naive Bayes accuracy | 85.88% (2645/3080) |\n| Macro-F1 (77 intents) | 0.8579 |\n| Top-3 accuracy | 95.16% |\n| Majority baseline accuracy | 1.30% |\n| Accuracy after excluding 7 train-overlap test queries | 85.84% |\n| Pending automated review queue | 535 cases |\n\nAlpha=0.1 was selected using training-derived validation, not the test set. These are measured **classifier results against published labels**, not the portfolio owner's personal accuracy. All human-review fields remain blank.\n\n- [Experiment and reproduction](02-AI-Data-Annotation/experiments/banking77/README.md)\n- [Actual results, limitations and examples](02-AI-Data-Annotation/experiments/banking77/results/REPORT.md)\n- [Source hashes and license](02-AI-Data-Annotation/experiments/banking77/source/source-manifest.json)\n- [10 experiment tests](02-AI-Data-Annotation/experiments/banking77/tests/test_banking77.py)\n\n```bash\npython 02-AI-Data-Annotation/experiments/banking77/run_experiment.py\npython -m unittest discover -s 02-AI-Data-Annotation/experiments/banking77/tests -v\n```\n\n<!-- BANKING77:END -->\n\n## Start here\n\n**Recruiter shortcut:** Begin with the [BANKING77 public-data experiment](02-AI-Data-Annotation/experiments/banking77/README.md), then choose one of the six clearly labelled synthetic demonstrations below. The [recruiter guide](recruiter-guide.md) provides a five-minute review path. The [website](website/index.html) is a static page. A root `index.html` is included for straightforward GitHub Pages setup; follow [`WEBSITE_DEPLOYMENT.md`](WEBSITE_DEPLOYMENT.md) after pushing the repository.\n\n\nIf you are reviewing this portfolio, I recommend starting with one project README, then opening its `results/analysis.md`, `results/review_queue.csv`, and `qa/worked-cases.md`. These show the method, the output, and the cases that still need human judgment.\n\n| Project | What I practised | Current result (synthetic benchmark only) |\n|---|---|---|\n| [LLM Pairwise Evaluation](01-LLM-Evaluation/) | Comparing two responses with a rubric and retaining disagreements for review | 45/50 agreement with provisional AI-authored preferences; not human accuracy |\n| [Data Annotation QA](02-AI-Data-Annotation/) | Topic, sentiment, urgency, entity spans, and a simple keyword baseline | 76.7% holdout topic accuracy; sentiment and urgency are weaker |\n| [Malayalam Translation Checks](03-Multilingual-AI-Evaluation/) | Unicode/integrity checks and a review workflow for Malayalam candidates | 5 automatic QC flags; not a translation-quality score |\n| [Synthetic Visual Evaluation](04-Multimodal-AI-Evaluation/) | Testing a pixel-based baseline on generated geometric images | 90% accuracy on eligible questions at 50% coverage; not a vision-language model evaluation |\n| [AI Quality Triage](05-AI-Quality-Evaluation/) | Reviewing a transparent lexical safety-triage baseline and its misses | Macro-F1 0.250; not a safety certification |\n| [Search Relevance](06-Search-Relevance/) | Ranking fictional results and calculating NDCG@4 and MRR | NDCG@4 0.962 on a small synthetic corpus; likely optimistic |\n\n## Reproduce the work\n\nUse Python 3.10 or newer. Install the pinned dependencies first:\n\n```bash\npython -m pip install -r requirements.txt\n```\n\n\nRequires Python and the dependencies listed in `requirements.txt`.\n\n```bash\npython analysis.py --project all\npython -m unittest discover -s tests -v\n```\n\nThe analysis runs locally; no network service is required. See `VALIDATION.md` for the recorded test coverage and `DATA_MANIFEST.json` for file hashes. The GitHub Actions workflow runs all three test suites on Python 3.10–3.13. For website publishing, follow [`WEBSITE_DEPLOYMENT.md`](WEBSITE_DEPLOYMENT.md); the site is not live until you deploy it.\n\n## What the results do—and do not—show\n\nThe code computes metrics from the supplied datasets. That makes the calculations reproducible; it does **not** make the synthetic reference labels ground truth. Several labels were generated with AI assistance, the multilingual project still needs a qualified Malayalam review, and the visual project uses artificial scenes. No human inter-annotator study, employer-policy validation, or production certification is claimed.\n\n## My next step\n\nI am working through the review checklist in [`PERSONAL-WORKBOOK.md`](PERSONAL-WORKBOOK.md): checking examples myself, recording real corrections, and noting what I can explain confidently. Blank fields are intentional; I will fill them only after doing the work.\n\n## Contact\n\n- Email: [sinshadsirajudheenpriv@gmail.com](mailto:sinshadsirajudheenpriv@gmail.com)\n- LinkedIn: [Sinshad PS](https://www.linkedin.com/in/sinshad-ps-587677418/)\n- GitHub: [sinshad-ops](https://github.com/sinshad-ops)\n\n## Licensing\n\nSee `LICENSE` and `DATA_LICENSE.md` for code and synthetic-data terms.\n", "../REAL_WORLD_DATA_UPGRADE.md": "# Real-world data upgrade plan\n\nThis portfolio currently includes a reproducible synthetic baseline. This file maps each project to a real public dataset or source that can be used for a stronger second experiment. **The current synthetic outputs have not been silently relabeled as real-world results.** Keep both experiments and compare them transparently.\n\n## Dataset mapping\n\n| Project | Suggested source | What it supports | Important caveat |\n|---|---|---|---|\n| 01 LLM Evaluation | Anthropic HH-RLHF (Hugging Face: `Anthropic/hh-rlhf`) | Human preference comparisons between assistant responses | This is human preference data, not your own customer dataset. Preserve source fields and license/terms. |\n| 02 AI Data Annotation | Banking77 (Hugging Face: `PolyAI/banking77`) | Realistic customer-support utterances labelled by intent | Public research data; do not call it data you collected or data from your own customers. Check the dataset card before redistribution. |\n| 03 Malayalam / multilingual | Chakravarthi et al., *A Sentiment Analysis Dataset for Code-Mixed Malayalam-English* | Human-labelled Malayalam-English social-media sentiment examples | This is code-mixed sentiment data, not translation quality. Keep it as a separate language QA experiment; do not present sentiment labels as translation judgments. |\n| 04 Multimodal | Microsoft COCO captions (or FHIBE for permitted fairness evaluation) | Real images paired with human-written captions, or consented human-centric images for fairness evaluation | COCO usage terms apply. FHIBE requires registration and is evaluation-only; it must not be used for general training. |\n| 05 Safety / quality | Civil Comments / Jigsaw toxicity dataset | Real online comments with crowd-labelled toxicity-related labels | Toxicity labels are imperfect and can encode annotator bias. Avoid claiming this is a complete safety policy benchmark. |\n| 06 Search relevance | MS MARCO | Real search queries, passages, and relevance labels for ranking experiments | Use the official data and respect its terms; don't claim it represents a live commercial search engine. |\n\n## Verified source links\n\n- Anthropic HH-RLHF: https://huggingface.co/datasets/Anthropic/hh-rlhf\n- Banking77: https://huggingface.co/datasets/PolyAI/banking77\n- Malayalam-English code-mixed sentiment: https://zenodo.org/records/4015234\n- Research overview for the Malayalam-English corpus: https://aclanthology.org/anthology-files/pdf/humeval/2024.humeval-1.pdf\n- Microsoft COCO: https://cocodataset.org/\n- Civil Comments: https://huggingface.co/datasets/google/civil_comments\n- MS MARCO: https://microsoft.github.io/msmarco/\n- FHIBE (consent-driven fairness evaluation images): https://fairnessbenchmark.ai.sony/\n\n## How to make the upgrade defensible\n\n1. Download each source from its official host and retain the dataset card, license, version/date, and original citation.\n2. Keep an immutable copy of the raw source data separate from cleaned/derived files. Do not commit large or restricted datasets to GitHub; commit scripts and a small permitted sample instead.\n3. Write a transformation script that maps source fields to the project schema. Log row counts before/after filtering and missing values.\n4. Create a held-out split before developing heuristics. Avoid evaluating on examples used to tune rules.\n5. Add a `source`, `source_record_id`, and `label_origin` field to every derived record. `label_origin` should distinguish `published_human_annotation`, `my_manual_review`, `model_output`, and `synthetic_example`.\n6. Personally review a documented sample. Record the sample size, review date, decisions, disagreements, and limitations. Do not claim independent human validation unless it happened.\n7. Recompute all metrics from the downloaded data. Replace the summary numbers only after the pipeline actually runs; never copy example or previous synthetic metrics into the real-data report.\n8. Include a provenance note such as: “I used a publicly released dataset, built the preprocessing/evaluation pipeline, and independently analyzed the results. The original annotations were supplied by the dataset authors.”\n\n## Recommended project order\n\nStart with Banking77 (small and straightforward), then Malayalam-English sentiment, then HH-RLHF and Civil Comments. MS MARCO and COCO are larger and need more careful sampling/storage planning. Use FHIBE only if you specifically want fairness evaluation and agree to its access terms.\n\n<!-- BANKING77:START -->\n## Implemented status\n\nBANKING77 is now downloaded from a pinned original revision, hash-verified and evaluated. See `02-AI-Data-Annotation/experiments/banking77/README.md`. The other proposed datasets remain a roadmap and have not been imported or evaluated. Existing synthetic data/results are preserved; no synthetic example has been relabeled as real.\n\n<!-- BANKING77:END -->\n", "../recruiter-guide.md": "# Recruiter Guide\n\n## Suggested five-minute review\n1. Start with the website’s six evidence cards.\n2. Open one metrics JSON and its chart.\n3. Inspect the corresponding review queue and three worked cases.\n4. Review `analysis.py` for label-independent baseline logic.\n5. Check tests and `VALIDATION.md`.\n6. Read the limitations before interpreting any metric.\n\n## What is demonstrated\nStructured evaluation design, reproducible Python analysis, rubric writing, dataset QA, error queues, basic visual generation/pixel analysis, local documentation, and honest scope control.\n\n## What is not demonstrated\nEmployment experience, production deployment, advanced machine learning, independently validated personal accuracy, natural-image VLM performance, or policy certification.\n\n\n\n\n\n<!-- BANKING77:START -->\n## Completed real-data experiment: BANKING77\n\nThe six original projects remain **synthetic baselines**. An additional real public-data experiment now evaluates a classifier on **10,003 official training queries / 3,080 test queries / 77 intents**. Original annotations are attributed to Casanueva et al. / PolyAI under CC BY 4.0; no personal annotation claim is made.\n\n| Official test result | Value |\n|---|---:|\n| Multinomial Naive Bayes accuracy | 85.88% (2645/3080) |\n| Macro-F1 (77 intents) | 0.8579 |\n| Top-3 accuracy | 95.16% |\n| Majority baseline accuracy | 1.30% |\n| Accuracy after excluding 7 train-overlap test queries | 85.84% |\n| Pending automated review queue | 535 cases |\n\nAlpha=0.1 was selected using training-derived validation, not the test set. These are measured **classifier results against published labels**, not the portfolio owner's personal accuracy. All human-review fields remain blank.\n\n- [Experiment and reproduction](02-AI-Data-Annotation/experiments/banking77/README.md)\n- [Actual results, limitations and examples](02-AI-Data-Annotation/experiments/banking77/results/REPORT.md)\n- [Source hashes and license](02-AI-Data-Annotation/experiments/banking77/source/source-manifest.json)\n- [10 experiment tests](02-AI-Data-Annotation/experiments/banking77/tests/test_banking77.py)\n\n```bash\npython 02-AI-Data-Annotation/experiments/banking77/run_experiment.py\npython -m unittest discover -s 02-AI-Data-Annotation/experiments/banking77/tests -v\n```\n\n<!-- BANKING77:END -->\n\n<!-- REAL_EVIDENCE:START -->\n# Recruiter evidence map\n\n## Best three things to inspect first\n1. **BANKING77 real-data experiment:** 13,083 public queries, 77 intents, 85.88% official-test classifier accuracy; leakage audit, source rights, actual error queue.\n2. **HH-RLHF public preference study:** 200 human-preference pairs; why length alone cannot replace rubric-based judgment; transparent ties and sampling bias.\n3. **Practical batch-QA case study:** measured query-length cohorts, high-confidence errors and an explicit proposed escalation workflow.\n\n| Role direction | Most relevant evidence | What is not claimed |\n|---|---|---|\n| AI data annotator / quality analyst | BANKING77 schema, references, confusion matrix, review queue, QA case study | Personal annotation score or client delivery |\n| AI / LLM evaluator | HH-RLHF preference study + synthetic rubric and disagreement cases | New production-model comparison or factual gold |\n| Malayalam–English evaluator | Synthetic translation rubrics, Unicode checks and native-review forms | Completed linguistic validation |\n| Multimodal evaluator | 120 rendered scenes, 240 answer records and RGB-pixel baseline | Natural-photo VLM expertise |\n| Safety / content reviewer | Synthetic contextual policy cases and triage failures | Employer-specific policy qualification |\n| Search evaluator | Fictional query relevance, NDCG/MRR and intent rationale | Live search-engine evaluation |\n\nAll implementation is AI-assisted and original datasets are attributed. Portfolio work is not employment history. Eligibility, language requirements and qualification tests remain role-specific.\n\n## Five-minute review\nRead the public-data README → inspect REPORT.md → open one prediction/error row → check the source/label origin → run a test suite. See QUALITY_REVIEW_PLAYBOOK.md for the review workflow.\n\n<!-- REAL_EVIDENCE:END -->\n", "../RELEASE_NOTES.md": "# Completed BANKING77 release\n\nThis is the completed real-data upgrade, not only a dataset roadmap. The six existing synthetic projects remain intact; the annotation project adds a separate public BANKING77 experiment.\n\n- Official data: 10,003 train / 3,080 test queries; 77 intents.\n- Naive Bayes: 85.88% accuracy; macro-F1 0.8579; top-3 accuracy 95.16%.\n- Seven test texts overlap normalized training text; excluding them gives 85.84% accuracy.\n- 535 cases await personal adjudication; review fields are intentionally blank.\n- CC BY 4.0 verified from the original repository; full source license and attribution included.\n- 21 automated tests pass; notebook actually executed; rerun predictions/metrics identical.\n- 156 pre-existing source/data files verified byte-identical; all six synthetic metric values unchanged.\n- Updated repository overview, website, LinkedIn/application drafts, one-page PDF and editable resume. Old PDF duplicates and caches omitted.\n\n## Reproduce offline\n\nFrom repository root, after installing requirements:\n\n```bash\npython reproduce_all.py\npython validate_release.py\n```\n\nFor just BANKING77:\n\n```bash\npython 02-AI-Data-Annotation/experiments/banking77/run_experiment.py\n```\n\nExisting `build_portfolio.py` reconstructs the original synthetic scaffolding. If you use it, run `reproduce_all.py` and `update_banking77_career.py` afterward to restore the upgrade integration; rerender the resume PDF if editing its content.\n\nThis release is AI-assisted. BANKING77 text and annotations belong to its cited original authors; classifier scores do not measure personal human annotation quality. No external publication has been performed. Only BANKING77 is upgraded to real public data; other proposed sources remain plans.\n\n## Packaging polish\n\n- JSON metrics are now written with explicit LF newlines for stable cross-platform regeneration.\n- Removed a stale third-party portfolio URL from the HTML resume; the GitHub profile link remains.\n- Added a recruiter shortcut and explicit local-site deployment note to the root README.\n- No repository was published, no website was deployed, and no human review was fabricated.\n\n## Final complete edition\n\nAdded a second real public-data study (HH-RLHF, 200 preference pairs), batch-QA cohort evidence and review playbook, role evidence map, executable notebook, seven new tests, and an offline website evidence reader. All 28 tests pass locally; two public-data studies rerun deterministically; 156 original synthetic input files and all six original synthetic metric values are preserved. Full release hashes are regenerated when packaging. Source caches and bytecode are excluded. No employment, clients, completed human review or external publication is invented.\n", "../ROLE_EVIDENCE_MAP.md": "# Recruiter evidence map\n\n## Best three things to inspect first\n1. **BANKING77 real-data experiment:** 13,083 public queries, 77 intents, 85.88% official-test classifier accuracy; leakage audit, source rights, actual error queue.\n2. **HH-RLHF public preference study:** 200 human-preference pairs; why length alone cannot replace rubric-based judgment; transparent ties and sampling bias.\n3. **Practical batch-QA case study:** measured query-length cohorts, high-confidence errors and an explicit proposed escalation workflow.\n\n| Role direction | Most relevant evidence | What is not claimed |\n|---|---|---|\n| AI data annotator / quality analyst | BANKING77 schema, references, confusion matrix, review queue, QA case study | Personal annotation score or client delivery |\n| AI / LLM evaluator | HH-RLHF preference study + synthetic rubric and disagreement cases | New production-model comparison or factual gold |\n| Malayalam–English evaluator | Synthetic translation rubrics, Unicode checks and native-review forms | Completed linguistic validation |\n| Multimodal evaluator | 120 rendered scenes, 240 answer records and RGB-pixel baseline | Natural-photo VLM expertise |\n| Safety / content reviewer | Synthetic contextual policy cases and triage failures | Employer-specific policy qualification |\n| Search evaluator | Fictional query relevance, NDCG/MRR and intent rationale | Live search-engine evaluation |\n\nAll implementation is AI-assisted and original datasets are attributed. Portfolio work is not employment history. Eligibility, language requirements and qualification tests remain role-specific.\n\n## Five-minute review\nRead the public-data README → inspect REPORT.md → open one prediction/error row → check the source/label origin → run a test suite. See QUALITY_REVIEW_PLAYBOOK.md for the review workflow.\n", "../START_HERE.md": "# Start here\n\nThis is a practice portfolio for remote AI generalist, response-evaluation, annotation, content-quality and search-evaluation work. It includes six AI-assisted synthetic demonstrations and two studies based on public datasets. It is not employment history.\n\n## A short review path\n\n1. Read the [main README](README.md) for scope and limitations.\n2. Open the [BANKING77 study](02-AI-Data-Annotation/experiments/banking77/README.md) and its report.\n3. Open the [HH-RLHF study](01-LLM-Evaluation/experiments/hh-preference/README.md) and check what the length baseline can and cannot tell us.\n4. Pick one synthetic project and inspect its examples, rubric and review queue.\n5. Run the relevant script and tests before discussing the implementation in an interview.\n\n## Reproduce the portfolio checks\n\n```bash\npython -m pip install -r requirements.txt\npython reproduce_all.py\npython verify_final.py\n```\n\nThe packaged validation report records the checks run when this version was assembled. That is not a substitute for running the code on your own machine. The GitHub Actions workflow has not been run on GitHub as part of this package.\n\n## Before publishing\n\nCheck every link, read the files you plan to discuss, and complete the [personal review workbook](PERSONAL-WORKBOOK.md) with your real observations. Keep the synthetic-data and AI-assistance disclosures visible. Do not describe practice examples as client work or claim human validation that has not happened.\n", "../VALIDATION.md": "# Validation Report\n\nGenerated automatically on 2026-10-09.\n\n- Deterministic seed: `20261008`\n- Test command: `python -m unittest discover -s tests -v`\n- Status: **PASS**\n\n## Covered checks\nSchema counts, unique IDs, annotation labels, exact substring spans, judge score ranges, image dimensions and non-background pixels, unique image hashes, metric ranges, output consistency, manifest hashes, and deterministic analysis reproduction.\n\n## Test output\n```text\ntest_annotation_labels_spans_and_counts (test_portfolio.PortfolioTests.test_annotation_labels_spans_and_counts) ... ok\ntest_deterministic_analysis (test_portfolio.PortfolioTests.test_deterministic_analysis) ... ok\ntest_image_pixels (test_portfolio.PortfolioTests.test_image_pixels) ... ok\ntest_judge_score_range (test_portfolio.PortfolioTests.test_judge_score_range) ... ok\ntest_manifest_hashes (test_portfolio.PortfolioTests.test_manifest_hashes) ... ok\ntest_output_consistency (test_portfolio.PortfolioTests.test_output_consistency) ... ok\ntest_schemas_ids_and_counts (test_portfolio.PortfolioTests.test_schemas_ids_and_counts) ... ok\ntest_all_notebooks_are_executed_outputs (test_regressions.RegressionTests.test_all_notebooks_are_executed_outputs) ... ok\ntest_baseline_does_not_depend_on_reference_labels (test_regressions.RegressionTests.test_baseline_does_not_depend_on_reference_labels) ... ok\ntest_metric_known_values (test_regressions.RegressionTests.test_metric_known_values) ... ok\ntest_multilingual_none_is_not_error (test_regressions.RegressionTests.test_multilingual_none_is_not_error) ... ok\n\n----------------------------------------------------------------------\nRan 11 tests in 26.769s\n\nOK\n```\n\n<!-- BANKING77_VALIDATION -->\n## Banking77 release\n\n10 new experiment tests and 11 preserved-suite tests pass. Actual notebook execution and deterministic rerun are verified. See [`02-AI-Data-Annotation/experiments/banking77/results/VALIDATION.md`](02-AI-Data-Annotation/experiments/banking77/results/VALIDATION.md). Original synthetic metric values and source datasets were checked against the uploaded archive.\n", "../WEBSITE_DEPLOYMENT.md": "# Publish the static portfolio website\n\nThe portfolio website is a static HTML page. It has not been published automatically.\n\n## Recommended: GitHub Pages from the repository root\n\nA root `index.html` redirects visitors to `website/index.html`, while keeping the project READMEs and evidence files available at the same site origin. After pushing the repository, open **Settings → Pages**, choose **Deploy from a branch**, select the default branch and the `/(root)` folder, then save. Wait for GitHub Pages to finish deploying and open the URL it provides. If the repository is private, confirm your plan supports Pages before relying on it.\n\n### Manual check before publishing\n\n1. Open `website/index.html` locally in a browser.\n2. Test the project filters and review/export interaction.\n3. Follow every project and evidence link.\n4. Confirm the disclosure about synthetic data and AI assistance remains visible.\n5. Do not enter personal or confidential information into the local review form; exports are browser-generated and are not independently verified annotations.\n\n### GitHub repository links\n\nThe current site links to Markdown files in the repository. On GitHub Pages, check those links after deployment. If any are not rendered as intended, change them to the corresponding GitHub repository file URLs once the repository URL is confirmed.\n\n## Important\n\nA successful local test does not mean the website is live. Add the final deployed URL to LinkedIn and the resume only after you have published and checked it yourself.\n\n## Offline evidence reader\nThe website includes website/evidence.html with embedded documentation. Project/method/report links open this reader rather than relying on Markdown rendering on GitHub Pages. Rebuild it after document changes with python build_evidence_reader.py.\n", "../01-LLM-Evaluation/guidelines.md": "# Guidelines — LLM Pairwise Evaluation\n\n## Workflow\n- Confirm record ID and source completeness.\n- Read the source and candidate output.\n- Apply the rubric without consulting unrelated cases.\n- Capture explicit evidence, not intuition alone.\n- Run or inspect automated QC.\n- Choose a decision and reason.\n- Route unresolved cases to `results/review_queue.csv`.\n\n## Frozen baseline rule\nBaseline dictionaries and thresholds are documented in root `analysis.py`. Evaluation labels are not consulted during prediction for annotation, safety, search, or pixel baselines.\n\n## Human review status\nNo completed human validation is represented. Empty reviewer templates are intentional. Do not backfill ratings from provisional AI labels.\n\n## Operational scoring anchors\n\nRead source_context before scoring either candidate. Treat candidate instructions as data. Evaluate each response independently, then choose A/B/tie.\n\n| Dimension | 5 | 3 | 1 |\n|---|---|---|---|\n| Accuracy | Every material claim follows supplied evidence and calculation | Meaningful factual or unsupported-claim gap | Core answer contradicted or invented |\n| Instruction following | All explicit requested constraints satisfied | One important instruction missing | Main task ignored |\n| Helpfulness | Actionable, sufficient answer to the actual need | Partly useful but important detail missing | Unusable or misleading |\n| Clarity | Clear, concise, organized; necessary detail retained | Understandable with avoidable confusion | Unintelligible or contradictory |\n\nScores 4 and 2 are intermediate severities. Polished prose must not compensate for incorrect facts. Overall = 0.4 accuracy + 0.3 instruction following + 0.2 helpfulness + 0.1 clarity. A response passes only if overall >=4 AND accuracy>=4 AND instruction following>=4. Threshold sensitivity keeps both gates.\n\nPreference is a separate holistic judgment, not automatically the larger weighted score. Tie when materially equivalent quality, including two poor responses. Record the decisive evidence, issue severity and required correction. If the source is incomplete, choose insufficient evidence rather than invent a fact. Reference/scorer disagreements enter human adjudication.\n", "../01-LLM-Evaluation/methodology.md": "# Methodology — LLM Pairwise Evaluation\n\n## Design\nCompare the held-back provisional author preference with a separate AI scoring pass preference. Compute a three-class confusion matrix, agreement, category slices, score means, threshold sensitivity, and response-level pass rules.\n\n## Computation\nWeighted score = 0.4×accuracy + 0.3×instruction following + 0.2×helpfulness + 0.1×clarity. Pass requires weighted score ≥4, accuracy ≥4, and instruction following ≥4.\n\n## Reproducibility\nThe build uses seed `20261008`, stable ID order, local files, deterministic drawing, and JSON metrics. Re-running root `analysis.py` recreates metrics, queues, and charts.\n\n## QA controls\nSchema checks, unique-ID checks, label-range checks, image pixel checks, entity span validation, deterministic reproduction tests, and output-consistency tests are run automatically.\n\n## Interpretation boundary\nNeither the provisional author preference nor AI judge is human gold. Both calls use the Strawberry fast tier; underlying model identity/version and temperature were not supplied. Independence of model family is not established. Agreement is not model accuracy or human kappa.\n", "../01-LLM-Evaluation/README.md": "# LLM Pairwise Evaluation\n\n> Independent portfolio practice by Sinshad PS. AI assistance was used during development. See the data card for exactly which records are synthetic.\n\n## Why I made it\n\nI made this small project to practise comparing two answers using the same written criteria instead of choosing whichever one sounds more polished. It keeps the rubric, provisional decisions and cases that deserve another look together. The example pairs and reference labels are synthetic, and AI tools helped me build the workflow. This is a practice exercise, not an evaluation job or a claim of human-verified accuracy.\n\n## Dataset\nSee [`data/DATA_CARD.md`](data/DATA_CARD.md). All records are UTF-8 and available as JSONL and CSV.\n\n## Evaluation framework\nCompare the held-back provisional author preference with a separate AI scoring pass preference. Compute a three-class confusion matrix, agreement, category slices, score means, threshold sensitivity, and response-level pass rules.\n\n## Scoring\nWeighted score = 0.4×accuracy + 0.3×instruction following + 0.2×helpfulness + 0.1×clarity. Pass requires weighted score ≥4, accuracy ≥4, and instruction following ≥4.\n\n## Tools\nPython standard library and Pillow. Inputs and outputs remain local; no network service is required.\n\n## Implementation\n- `src/analyze.py` runs this project independently.\n- Root `analysis.py --project llm` contains reusable metric and plotting logic.\n- `notebooks/analysis.ipynb` contains executable code and captured output from the real metrics file.\n- `results/review_queue.csv` makes disagreements, failures, escalations, or abstentions visible.\n- `qa/worked-cases.md` connects evidence, rubric, QC, and decisions.\n\n## Results\n**AI-reference agreement: 90.0%**\n\nThe complete machine-readable output is [`results/metrics.json`](results/metrics.json), with interpretation in [`results/analysis.md`](results/analysis.md).\n\n![Result chart](results/chart.png)\n\n## What the result means\n\nThe reported 45/50 agreement is agreement with provisional AI-authored preferences—not human accuracy or evidence that a real model performs at 90%. The model family/version is not known, so I do not claim independent model-family validation.\n\n## Limitations\nNeither the provisional author preference nor AI judge is human gold. Both calls use the Strawberry fast tier; underlying model identity/version and temperature were not supplied. Independence of model family is not established. Agreement is not model accuracy or human kappa.\n\n## Future work\nRun blinded qualified human review, adjudicate disagreements, document reviewer eligibility, test robustness under distribution shift, and revise rules only on calibration data before re-evaluating holdout data.\n\n## Reproduction\nFrom repository root:\n\n`python analysis.py --project llm`\n\nor:\n\n`python 01-LLM-Evaluation/src/analyze.py`\n\nRun validation with:\n\n`python -m unittest discover -s tests`\n\nDeterministic seed: `20261008`. Build date: 2026-10-09.\n\n## Concrete findings\n\nThe separate AI scoring pass agrees with provisional author preferences on 45/50 pairs (90.0%). There are 5 disagreements, all retained in the review queue. The author and scorer use the same Strawberry tier; their underlying model identities are unavailable. This is not independent-human agreement.\n\nThe provisional references contain 5 ties; the scorer contains 0 ties. Inspect ties before interpreting aggregate agreement: a forced preference can hide equally useful alternatives. Pass rate across 100 synthetic candidate responses is 50.0% under the documented weighted rubric. It describes this constructed response set, not a real model or the candidate's personal accuracy.\n\nSee [findings](results/findings.md) and the raw review queue.\n\n<!-- HH_STUDY:START -->\n## Second completed public-data study: human preference analysis\n\n**200 HH-RLHF pairs / 400 original candidate responses**, with source-published human preferences, a pinned official revision, MIT notice and documented sampling rules. A longer-response proxy agrees on **117/195 non-tied pairs (60%)**, with five ties. The deterministic coin baseline is **50.5%**. This shows the limits of superficial ranking proxies—not personal evaluator accuracy or production-model quality.\n\n- [Source, methodology and reproduction](experiments/hh-preference/README.md)\n- [Actual results and bias limits](experiments/hh-preference/results/REPORT.md)\n- [Operational BANKING77 audit](../02-AI-Data-Annotation/experiments/banking77/results/QA_CASE_STUDY.md)\n- [Practical review playbook](../QUALITY_REVIEW_PLAYBOOK.md)\n\nThe portfolio contains **two real public-data studies plus six synthetic baseline demonstrations**. The original authors supplied public labels; personal review fields remain blank.\n\n<!-- HH_STUDY:END -->\n", "../01-LLM-Evaluation/rubrics.md": "# Rubric — LLM Pairwise Evaluation\n\n## Decision principles\n1. Inspect the source evidence before labels or baseline output where blinding is possible.\n2. Apply the written criteria consistently; do not infer missing facts.\n3. Record a decision, confidence, evidence quote or region, and concise rationale.\n4. Escalate ambiguity, policy uncertainty, malformed evidence, or material disagreement.\n5. Never convert automatic QC flags into unreviewed claims of semantic correctness.\n\n## Project scoring\nWeighted score = 0.4×accuracy + 0.3×instruction following + 0.2×helpfulness + 0.1×clarity. Pass requires weighted score ≥4, accuracy ≥4, and instruction following ≥4.\n\n## Resolution\nA reviewer may uphold the reference, uphold the baseline/candidate, revise both, or mark insufficient evidence. Material disagreements require a second review and adjudication. Human-review fields remain blank until a real reviewer completes them.\n", "../02-AI-Data-Annotation/guidelines.md": "# Guidelines — Multi-task AI Data Annotation\n\n## Workflow\n- Confirm record ID and source completeness.\n- Read the source and candidate output.\n- Apply the rubric without consulting unrelated cases.\n- Capture explicit evidence, not intuition alone.\n- Run or inspect automated QC.\n- Choose a decision and reason.\n- Route unresolved cases to `results/review_queue.csv`.\n\n## Frozen baseline rule\nBaseline dictionaries and thresholds are documented in root `analysis.py`. Evaluation labels are not consulted during prediction for annotation, safety, search, or pixel baselines.\n\n## Human review status\nNo completed human validation is represented. Empty reviewer templates are intentional. Do not backfill ratings from provisional AI labels.\n\n## Label definitions\n\nOne primary topic: billing = charge/payment/invoice dispute; account = authentication or profile access; delivery = shipment status or arrival; technical = malfunction of an app/device/site; refund = explicit request to return money or reverse purchase; general = other or no actionable category. Multi-intent: prioritize the explicitly requested resolution, not the first keyword. When two requests have equal priority, flag ambiguity and record the chosen primary request.\n\nSentiment: positive = praise/satisfaction; negative = dissatisfaction/complaint; neutral = factual request without clear affect; mixed = substantive positive AND negative judgments. Courtesy words alone do not force positive. Negation must be read (not happy is negative).\n\nUrgency: high = immediate time-critical loss/access/safety consequence, explicit immediate deadline; medium = a stated delay, issue or near-term dependency without immediate serious consequence; low = routine information or no urgency evidence. Do not infer high urgency from complaint intensity alone. Borderline cases need rationale.\n\nEntity tags: ORDER_ID = order reference, PRODUCT = named product/service, DATE = date/time phrase, ORG = organization. Use exact Unicode substring offsets, start inclusive/end exclusive; no punctuation not part of the name. Annotate each occurrence separately. Repeated-text provisional references currently use the first occurrence and are flagged; this is a known pending adjudication issue. Unknown or absent substrings are quarantined. No inferred entities.\n\nBlind the reviewer to provisional labels before independent annotation. Audit schemas/spans, compare decisions, document disagreements and adjudicate before establishing human gold. The controlled corruption exercise is not human IAA. The fixed 70/30 split was not randomized, and cannot establish population-level accuracy.\n", "../02-AI-Data-Annotation/methodology.md": "# Methodology — Multi-task AI Data Annotation\n\n## Design\nFrozen keyword dictionaries predict topic, sentiment, and urgency without reading reference labels. Regex extracts only high-confidence order/date entities. The first 70 IDs are calibration and final 30 are holdout.\n\n## Computation\nAccuracy and macro-F1 are computed separately per task. Entity precision/recall/F1 requires exact start, end, and label match.\n\n## Reproducibility\nThe build uses seed `20261008`, stable ID order, local files, deterministic drawing, and JSON metrics. Re-running root `analysis.py` recreates metrics, queues, and charts.\n\n## QA controls\nSchema checks, unique-ID checks, label-range checks, image pixel checks, entity span validation, deterministic reproduction tests, and output-consistency tests are run automatically.\n\n## Interpretation boundary\nKeywords are brittle and entity coverage is intentionally narrow. The controlled second-label corruption is SIMULATION NOT HUMAN and cannot establish annotator agreement.\n", "../02-AI-Data-Annotation/README.md": "# Data Annotation and Quality Checks\n\n> Independent portfolio practice by Sinshad PS. AI assistance was used during development. See the data card for exactly which records are synthetic.\n\n## Why I made it\n\nThis project is about the unglamorous part of annotation: checking whether labels follow the rules, finding inconsistent cases, and making it clear what needs a second look. The starter examples and their provisional labels are synthetic. The BANKING77 experiment in this folder is a separate public-data study and is clearly documented on its own page.\n\n## Dataset\nSee [`data/DATA_CARD.md`](data/DATA_CARD.md). All records are UTF-8 and available as JSONL and CSV.\n\n## Evaluation framework\nFrozen keyword dictionaries predict topic, sentiment, and urgency without reading reference labels. Regex extracts only high-confidence order/date entities. The first 70 IDs are calibration and final 30 are holdout.\n\n## Scoring\nAccuracy and macro-F1 are computed separately per task. Entity precision/recall/F1 requires exact start, end, and label match.\n\n## Tools\nPython standard library and Pillow. Inputs and outputs remain local; no network service is required.\n\n## Implementation\n- `src/analyze.py` runs this project independently.\n- Root `analysis.py --project annotation` contains reusable metric and plotting logic.\n- `notebooks/analysis.ipynb` contains executable code and captured output from the real metrics file.\n- `results/review_queue.csv` makes disagreements, failures, escalations, or abstentions visible.\n- `qa/worked-cases.md` connects evidence, rubric, QC, and decisions.\n\n## Results\n**Holdout topic accuracy: 76.7%**\n\nThe complete machine-readable output is [`results/metrics.json`](results/metrics.json), with interpretation in [`results/analysis.md`](results/analysis.md).\n\n![Result chart](results/chart.png)\n\n## What the result means\n\nThe 76.7% topic accuracy is measured on this small synthetic holdout only. Sentiment and urgency perform much worse, and entity-span F1 is zero on the holdout. The simulated second-label exercise is not human inter-annotator agreement.\n\n## Limitations\nKeywords are brittle and entity coverage is intentionally narrow. The controlled second-label corruption is SIMULATION NOT HUMAN and cannot establish annotator agreement.\n\n## Future work\nRun blinded qualified human review, adjudicate disagreements, document reviewer eligibility, test robustness under distribution shift, and revise rules only on calibration data before re-evaluating holdout data.\n\n## Reproduction\nFrom repository root:\n\n`python analysis.py --project annotation`\n\nor:\n\n`python 02-AI-Data-Annotation/src/analyze.py`\n\nRun validation with:\n\n`python -m unittest discover -s tests`\n\nDeterministic seed: `20261008`. Build date: 2026-10-09.\n\n## Concrete findings\n\nOn the 30-record held-out partition, the frozen keyword baseline achieves topic accuracy 76.7%, sentiment accuracy 40.0%, and urgency accuracy 43.3%. This uneven performance shows why annotation requires meaning-level review rather than keyword matching.\n\nExact entity-span F1 is 0.000 on holdout. The extractor only recognizes limited order/date formats, not PRODUCT or ORG names; unsupported entity classes are not silently excluded from the denominator. The weak result is intentional evidence of baseline scope, not an annotation-quality claim.\n\n29 records enter the structural/ambiguity review queue, and 2 records have span warnings. The simulated second-label exercise injects 13 known topic corruptions; its agreement statistic is a simulation, not human inter-annotator agreement. Calibration/holdout is a fixed order split, not random population sampling; no dictionaries were tuned on held-out labels during this run.\n\nSee [findings](results/findings.md) and the raw review queue.\n\n<!-- BANKING77:START -->\n## Completed real-data experiment: BANKING77\n\nThe six original projects remain **synthetic baselines**. An additional real public-data experiment now evaluates a classifier on **10,003 official training queries / 3,080 test queries / 77 intents**. Original annotations are attributed to Casanueva et al. / PolyAI under CC BY 4.0; no personal annotation claim is made.\n\n| Official test result | Value |\n|---|---:|\n| Multinomial Naive Bayes accuracy | 85.88% (2645/3080) |\n| Macro-F1 (77 intents) | 0.8579 |\n| Top-3 accuracy | 95.16% |\n| Majority baseline accuracy | 1.30% |\n| Accuracy after excluding 7 train-overlap test queries | 85.84% |\n| Pending automated review queue | 535 cases |\n\nAlpha=0.1 was selected using training-derived validation, not the test set. These are measured **classifier results against published labels**, not the portfolio owner's personal accuracy. All human-review fields remain blank.\n\n- [Experiment and reproduction](experiments/banking77/README.md)\n- [Actual results, limitations and examples](experiments/banking77/results/REPORT.md)\n- [Source hashes and license](experiments/banking77/source/source-manifest.json)\n- [10 experiment tests](experiments/banking77/tests/test_banking77.py)\n\n```bash\npython experiments/banking77/run_experiment.py\npython -m unittest discover -s experiments/banking77/tests -v\n```\n\n<!-- BANKING77:END -->\n", "../02-AI-Data-Annotation/rubrics.md": "# Rubric — Multi-task AI Data Annotation\n\n## Decision principles\n1. Inspect the source evidence before labels or baseline output where blinding is possible.\n2. Apply the written criteria consistently; do not infer missing facts.\n3. Record a decision, confidence, evidence quote or region, and concise rationale.\n4. Escalate ambiguity, policy uncertainty, malformed evidence, or material disagreement.\n5. Never convert automatic QC flags into unreviewed claims of semantic correctness.\n\n## Project scoring\nAccuracy and macro-F1 are computed separately per task. Entity precision/recall/F1 requires exact start, end, and label match.\n\n## Resolution\nA reviewer may uphold the reference, uphold the baseline/candidate, revise both, or mark insufficient evidence. Material disagreements require a second review and adjudication. Human-review fields remain blank until a real reviewer completes them.\n", "../03-Multilingual-AI-Evaluation/guidelines.md": "# Guidelines — Malayalam Translation Evaluation\n\n## Workflow\n- Confirm record ID and source completeness.\n- Read the source and candidate output.\n- Apply the rubric without consulting unrelated cases.\n- Capture explicit evidence, not intuition alone.\n- Run or inspect automated QC.\n- Choose a decision and reason.\n- Route unresolved cases to `results/review_queue.csv`.\n\n## Frozen baseline rule\nBaseline dictionaries and thresholds are documented in root `analysis.py`. Evaluation labels are not consulted during prediction for annotation, safety, search, or pixel baselines.\n\n## Human review status\nNo completed human validation is represented. Empty reviewer templates are intentional. Do not backfill ratings from provisional AI labels.\n\n## Native-speaker review rubric\n\nMeaning preservation: verify every actor, action, negation, condition, time, number and obligation. Grammar: morphology, agreement and sentence formation. Naturalness: idiomatic Malayalam rather than literal English order. Register/context: audience-appropriate politeness and locally suitable terminology; accept legitimate regional variants.\n\nScore each dimension 1–5: 5 no material issue; 4 minor localized problem; 3 important repair needed; 2 multiple major failures; 1 unusable or meaning reversed. Tag omission, meaning_shift, register, number_error or negation_error; none means no seeded defect, not independently verified correctness.\n\nReview English source, both candidates, and reference Malayalam. Write rationale in English with the exact Malayalam span and proposed correction. Two fluent alternatives may tie. If neither preserves meaning, neither should be accepted merely because one sounds smoother. Escalate ambiguity in the source.\n\nScript/NFC/digit checks are integrity flags only. Numbers spelled in Malayalam may legitimately lack ASCII digits. The first native review should hide provisional preferences; do not copy them into blank reviewer forms.\n", "../03-Multilingual-AI-Evaluation/methodology.md": "# Methodology — Malayalam Translation Evaluation\n\n## Design\nSummarize benchmark preference/error composition, then run NFC, Malayalam-codepoint ratio, and digit-preservation flag checks.\n\n## Computation\nComposition error rate counts supplied synthetic error tags. Automatic QC flags are integrity indicators, not linguistic scores.\n\n## Reproducibility\nThe build uses seed `20261008`, stable ID order, local files, deterministic drawing, and JSON metrics. Re-running root `analysis.py` recreates metrics, queues, and charts.\n\n## QA controls\nSchema checks, unique-ID checks, label-range checks, image pixel checks, entity span validation, deterministic reproduction tests, and output-consistency tests are run automatically.\n\n## Interpretation boundary\nMalayalam native human review is pending. Digit translation may legitimately use Malayalam digits or spelled numbers; flags are never definitive language correctness.\n", "../03-Multilingual-AI-Evaluation/README.md": "# Malayalam–English Text QA Practice\n\n> Independent portfolio practice by Sinshad PS. AI assistance was used during development. See the data card for exactly which records are synthetic.\n\n## Why I made it\n\nI used this project to explore basic checks that can flag suspicious Malayalam text records, such as script coverage, Unicode normalization and digit changes. These checks can catch formatting problems, but they cannot tell me on their own whether a translation is natural or correct. The examples and provisional labels are synthetic, and proper language-quality conclusions still need a qualified human reviewer.\n\n## Dataset\nSee [`data/DATA_CARD.md`](data/DATA_CARD.md). All records are UTF-8 and available as JSONL and CSV.\n\n## Evaluation framework\nSummarize benchmark preference/error composition, then run NFC, Malayalam-codepoint ratio, and digit-preservation flag checks.\n\n## Scoring\nComposition error rate counts supplied synthetic error tags. Automatic QC flags are integrity indicators, not linguistic scores.\n\n## Tools\nPython standard library and Pillow. Inputs and outputs remain local; no network service is required.\n\n## Implementation\n- `src/analyze.py` runs this project independently.\n- Root `analysis.py --project multilingual` contains reusable metric and plotting logic.\n- `notebooks/analysis.ipynb` contains executable code and captured output from the real metrics file.\n- `results/review_queue.csv` makes disagreements, failures, escalations, or abstentions visible.\n- `qa/worked-cases.md` connects evidence, rubric, QC, and decisions.\n\n## Results\n**Automatic QC flags: 5 of 100**\n\nThe complete machine-readable output is [`results/metrics.json`](results/metrics.json), with interpretation in [`results/analysis.md`](results/analysis.md).\n\n![Result chart](results/chart.png)\n\n## What the result means\n\nFive of 100 candidates trigger automatic checks. These are integrity flags, not a linguistic quality score. Semantic accuracy, grammar, naturalness, and cultural nuance still require a qualified Malayalam reviewer; that review has not yet been completed.\n\n## Limitations\nMalayalam native human review is pending. Digit translation may legitimately use Malayalam digits or spelled numbers; flags are never definitive language correctness.\n\n## Future work\nRun blinded qualified human review, adjudicate disagreements, document reviewer eligibility, test robustness under distribution shift, and revise rules only on calibration data before re-evaluating holdout data.\n\n## Reproduction\nFrom repository root:\n\n`python analysis.py --project multilingual`\n\nor:\n\n`python 03-Multilingual-AI-Evaluation/src/analyze.py`\n\nRun validation with:\n\n`python -m unittest discover -s tests`\n\nDeterministic seed: `20261008`. Build date: 2026-10-09.\n\n## Concrete findings\n\nThe benchmark contains 50 English prompts and 100 Malayalam candidate translations. Automatic integrity checks flag 5 candidates. Passing these checks cannot establish semantic fidelity, grammatical correctness or cultural appropriateness.\n\nError categories describe synthetic benchmark construction. The category 'none' is retained in the composition table but is excluded from per-domain error-rate numerators. Digit mismatches are review flags because Malayalam may express a number in words. Native-speaker judgments, rationale edits and adjudication remain pending; blank reviewer forms are supplied rather than fabricated ratings.\n\nSee [findings](results/findings.md) and the raw review queue.\n", "../03-Multilingual-AI-Evaluation/rubrics.md": "# Rubric — Malayalam Translation Evaluation\n\n## Decision principles\n1. Inspect the source evidence before labels or baseline output where blinding is possible.\n2. Apply the written criteria consistently; do not infer missing facts.\n3. Record a decision, confidence, evidence quote or region, and concise rationale.\n4. Escalate ambiguity, policy uncertainty, malformed evidence, or material disagreement.\n5. Never convert automatic QC flags into unreviewed claims of semantic correctness.\n\n## Project scoring\nComposition error rate counts supplied synthetic error tags. Automatic QC flags are integrity indicators, not linguistic scores.\n\n## Resolution\nA reviewer may uphold the reference, uphold the baseline/candidate, revise both, or mark insufficient evidence. Material disagreements require a second review and adjudication. Human-review fields remain blank until a real reviewer completes them.\n", "../04-Multimodal-AI-Evaluation/guidelines.md": "# Guidelines — Synthetic Visual Evaluation\n\n## Workflow\n- Confirm record ID and source completeness.\n- Read the source and candidate output.\n- Apply the rubric without consulting unrelated cases.\n- Capture explicit evidence, not intuition alone.\n- Run or inspect automated QC.\n- Choose a decision and reason.\n- Route unresolved cases to `results/review_queue.csv`.\n\n## Frozen baseline rule\nBaseline dictionaries and thresholds are documented in root `analysis.py`. Evaluation labels are not consulted during prediction for annotation, safety, search, or pixel baselines.\n\n## Human review status\nNo completed human validation is represented. Empty reviewer templates are intentional. Do not backfill ratings from provisional AI labels.\n\n## Visual evidence rules\n\nOpen the PNG and question, not only scene metadata. Count visible colored objects; exclude panels, outlines and labels. Color frequency means object count, not pixel area. For equal color counts, choose the color of the leftmost object; the current baseline's column-first scan has a documented tie limitation on multi-row scenes. Bar-height questions compare vertical extent, not color brightness. Spatial questions compare the specified object centers/positions. Absence requires inspecting the full central panel.\n\nCheck the answer against rendered evidence a
